name: bag_axi_xbar
kind: fabric
api_version: 1
description: 'AXI4 crossbar: per-master guards (bag_axi_guard: aliases, rules, Access_Rules, RO/WO, secure, misses) in front of PULP axi_xbar, which steers on the route bits the guards write above the address.'
protocols:
  - AXI4
topologies:
  - crossbar
arbitration:
  - round-robin
param_map:
  n_master_ports: Cfg.NoSlvPorts
  n_slave_ports: Cfg.NoMstPorts
  max_mst_trans: Cfg.MaxMstTrans
  max_slv_trans: Cfg.MaxSlvTrans
  latency_mode: Cfg.LatencyMode
  id_width_master_side: Cfg.AxiIdWidthSlvPorts
  id_used_master_side: Cfg.AxiIdUsedSlvPorts
  addr_width: Cfg.AxiAddrWidth
  data_width: Cfg.AxiDataWidth
  n_addr_rules: Cfg.NoAddrRules
sources:
  - rtl/inhouse/bag_addr_decode.sv
  - rtl/inhouse/bag_axi_from_flat.sv
  - rtl/inhouse/bag_axi_guard.sv
  - rtl/inhouse/bag_axi_to_flat.sv
  - rtl/inhouse/bag_axi_xbar.sv
  - bender:axi:axi_xbar
  - bender:axi:axi_demux_simple
  - bender:axi:axi_err_slv
licence: SHL-0.51
qualification: unqualified
rtl: true
