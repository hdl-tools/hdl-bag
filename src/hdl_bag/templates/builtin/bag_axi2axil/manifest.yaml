name: bag_axi2axil
kind: bridge
api_version: 1
description: 'AXI4 to AXI4-Lite from PULP blocks: inside the bridge (D10) axi_dw_converter (on AXI4, D33), axi_to_axi_lite, axi_fifo (FIFO depth), axi_cdc and the pass-through-N offset. PULP limits: WRAP bursts, non-modifiable bursts of 2 to 16 beats, non-modifiable accesses wider than the downstream bus, and (when the bridge narrows) multi-beat FIXED bursts get SLVERR; write errors return as SLVERR; USER, AxCACHE, QoS, REGION and LOCK are not carried.'
upstream:
  - AXI4
downstream:
  - AXI4-Lite
sources:
  - bender:axi:axi_cdc
  - bender:axi:axi_dw_converter
  - bender:axi:axi_fifo
  - bender:axi:axi_to_axi_lite
  - rtl/inhouse/bag_axi2axil.sv
  - rtl/inhouse/bag_axi_from_flat.sv
  - rtl/inhouse/bag_axil_to_flat.sv
licence: SHL-0.51
qualification: unqualified
rtl: true
