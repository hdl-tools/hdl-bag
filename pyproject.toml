[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hdl-bag"
version = "0.0.1"
description = "BAG - Bus Architecture Generator: spec-based AMBA bus-fabric RTL generator"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "AUTHORS"]
authors = [{ name = "The hdl-bag Authors" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
# `bag sim` and the generated tests.
sim = ["cocotb==2.1.0", "cocotbext-axi==0.1.28"]

[project.urls]
Repository = "https://github.com/hdl-tools/hdl-bag"

[project.scripts]
bag = "hdl_bag.cli:main"
hdl-bag = "hdl_bag.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
    "types-openpyxl>=3.1.5.20261017",
    # cocotb smoke tests (pytest -m eda); installed everywhere so mypy sees its types.
    "cocotb==2.1.0",
    "cocotbext-axi==0.1.28",
    "pytest-xdist==3.8.0",
    "pytest-split==0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hdl_bag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src:tests/rtl:tests/configs:tests/mutation:tests/flows"

[[tool.mypy.overrides]]
# cocotbext-axi ships no type information.
module = ["cocotbext.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# EDA tests need the tools image; run them with `pytest -m eda`.
addopts = "-ra -m 'not eda'"
markers = [
    "eda: needs the EDA tools (Verilator, slang, Verible, cocotb)",
    "smoke: the per-PR subset of the EDA tests (tests/smoke.py)",
    "deep: an EDA test beyond the full run's time limit; the nightly runs it (D74)",
]

[tool.ruff.lint.per-file-ignores]
# Header comments, notes and formulas are schema text; keep them verbatim on one line.
"src/hdl_bag/template/*.py" = ["E501"]
# Rule messages are user-facing text; keep each on one line.
"src/hdl_bag/checks/*.py" = ["E501"]
"src/hdl_bag/ir/resolve.py" = ["E501"]
"src/hdl_bag/ir/to_workbook.py" = ["E501"]
"tests/checks/*.py" = ["E501"]
"tests/test_cli.py" = ["E501"]
"tests/flows/*.py" = ["E501"]
"tests/rtl/*.py" = ["E501"]
"tests/configs/**/*.py" = ["E501"]
"tests/gen/cocotb_*.py" = ["E501"]
"src/hdl_bag/tests_gen/*.py" = ["E501"]
