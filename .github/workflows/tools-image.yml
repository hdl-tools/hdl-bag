name: tools-image

on:
  push:
    branches: [main]
    paths:
      - tools.lock
      - tools/Dockerfile
      - tools/tools.sha256
      - scripts/tool_specs.py
      - scripts/install_tools.py
      - .dockerignore
      - .github/workflows/tools-image.yml
  pull_request:
    paths:
      - tools.lock
      - tools/Dockerfile
      - tools/tools.sha256
      - scripts/tool_specs.py
      - scripts/install_tools.py
      - .dockerignore
      - .github/workflows/tools-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # One job per architecture, each on a runner of that architecture. Building both in one
  # job would mean QEMU for the second, and the Verilator and slang stages are source
  # builds: minutes natively, well over an hour emulated. Each job pushes by digest only,
  # and the merge job below is what creates the tags.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build args from tools.lock
        id: args
        run: |
          {
            echo 'list<<EOF'
            grep -Ev '^\s*(#|$)' tools.lock
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          # The repository root, because the installer and tools.lock live there;
          # .dockerignore keeps the context down to the four files the build needs.
          context: .
          file: tools/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.args.outputs.list }}
          # By digest, with no tag: the merge job assembles the tags from both digests. A
          # pull request builds and does not push, so it still proves the Dockerfile works.
          outputs: >-
            type=image,name=ghcr.io/hdl-tools/hdl-bag-tools,push-by-digest=true,
            name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      # Through a file rather than a job output: a matrix job's outputs are taken from one
      # instance wholesale, so the other architecture's digest would always come back empty.
      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Both architectures under one tag, so `docker run ghcr.io/...:main` picks the right one
  # and the container: jobs in the other workflows keep working unchanged.
  manifest:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both architectures
        working-directory: /tmp/digests
        env:
          CONTENT: ${{ hashFiles('tools.lock', 'tools/Dockerfile', 'tools/tools.sha256', 'scripts/tool_specs.py', 'scripts/install_tools.py') }}
        run: |
          set -euo pipefail
          repo=ghcr.io/hdl-tools/hdl-bag-tools
          # One file per architecture, named after its digest.
          test "$(ls -1 | wc -l)" -eq 2
          docker buildx imagetools create \
            --tag "$repo:main" --tag "$repo:$CONTENT" \
            $(printf "$repo@sha256:%s " *)
          docker buildx imagetools inspect "$repo:main"
