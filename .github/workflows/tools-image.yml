name: tools-image

on:
  push:
    branches: [main]
    paths:
      - tools.lock
      - tools/Dockerfile
      - tools/tools.sha256
      - scripts/tool_specs.py
      - scripts/install_tools.py
      - .dockerignore
      - .github/workflows/tools-image.yml
  pull_request:
    paths:
      - tools.lock
      - tools/Dockerfile
      - tools/tools.sha256
      - scripts/tool_specs.py
      - scripts/install_tools.py
      - .dockerignore
      - .github/workflows/tools-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build args from tools.lock
        id: args
        run: |
          {
            echo 'list<<EOF'
            grep -Ev '^\s*(#|$)' tools.lock
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # The repository root, because the installer and tools.lock live there;
          # .dockerignore keeps the context down to the four files the build needs.
          context: .
          file: tools/Dockerfile
          build-args: ${{ steps.args.outputs.list }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/hdl-tools/hdl-bag-tools:${{ hashFiles('tools.lock', 'tools/Dockerfile', 'tools/tools.sha256', 'scripts/tool_specs.py', 'scripts/install_tools.py') }}
            ghcr.io/hdl-tools/hdl-bag-tools:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
