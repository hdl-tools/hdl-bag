name: eda-shards

# Lint flow, simulation and formal tests against the pinned EDA tools: parallel jobs (four
# unless the caller asks for more) balanced by tests/eda_durations.json (pytest-split; refresh it with scripts/eda_durations.py), each spread
# over the runner's cores with pytest-xdist (every test has its own out/ directory). Called by
# pr.yml (the smoke subset on pull requests, the full list on main and nightly) and by
# full-eda.yml (the full list on a pull request labelled full-eda).

on:
  workflow_call:
    inputs:
      marks:
        description: pytest -m expression
        type: string
        required: true
      save-cache:
        description: Save the ccache entries (the nightly only restores, to spare the cache limit)
        type: boolean
        default: true
      timeout-minutes:
        description: Each shard's time limit (the nightly's deep tests need more, D74)
        type: number
        default: 30
      shards:
        description: How many parallel jobs (the nightly's formal corpus needs more, D76)
        type: number
        default: 4
      workers:
        description: Tests at once per job (pytest-xdist -n); fewer leave each solver a core
        type: string
        default: auto
      deep-timeout:
        description: The SBY time limit of a deep formal test, in seconds (D76)
        type: number
        default: 7200
      keyword:
        description: Only the tests whose names match this pytest -k expression (all if empty)
        type: string
        default: ""
      bmc-engine:
        description: Run the formal corpus's protocol bmc tasks on this SBY engine (D84; as generated if empty)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  groups:
    # The matrix needs a list: 1 to the shard count.
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        run: echo "list=[$(seq -s , 1 ${{ inputs.shards }})]" >> "$GITHUB_OUTPUT"

  shard:
    needs: groups
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.list) }}
    container:
      image: ghcr.io/hdl-tools/hdl-bag-tools:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      # A cold C++ build is most of the time here, and Verilator's makefiles use ccache when
      # it is there. BASEDIR and NOHASHDIR let builds in different out/ directories share.
      CCACHE_DIR: /tmp/ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_NOHASHDIR: "true"
      EDA_MARKS: ${{ inputs.marks }}
      BAG_DEEP_TIMEOUT_S: ${{ inputs.deep-timeout }}
      EDA_KEYWORD: ${{ inputs.keyword }}
      BAG_BMC_ENGINE: ${{ inputs.bmc-engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/ccache
          key: ccache-v2-${{ matrix.group }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v2-${{ matrix.group }}-
            ccache-v2-
      - run: uv sync --locked
      - run: ccache --zero-stats
      - run: >-
          CCACHE_BASEDIR="$PWD"
          uv run pytest -m "$EDA_MARKS" ${EDA_KEYWORD:+-k "$EDA_KEYWORD"} -n ${{ inputs.workers }} --splits ${{ inputs.shards }} --group ${{ matrix.group }}
          --durations-path tests/eda_durations.json --splitting-algorithm least_duration
          --durations=0 --durations-min=0
      - run: ccache --show-stats
        if: always()
      # A failed formal test leaves its job's work in pytest's temporary directory: keep the
      # counterexample and cover traces with the property files they refer to, for diagnosis.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: formal-traces-${{ matrix.group }}
          path: |
            /tmp/pytest-of-*/**/formal/*.sv
            /tmp/pytest-of-*/**/formal/*.sby
            /tmp/pytest-of-*/**/formal/*/engine_*/trace*.vcd
            /tmp/pytest-of-*/**/formal/*/engine_*/trace*.yw
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/cache/save@v4
        if: success() && inputs.save-cache
        with:
          path: /tmp/ccache
          key: ccache-v2-${{ matrix.group }}-${{ github.sha }}-${{ github.run_attempt }}
