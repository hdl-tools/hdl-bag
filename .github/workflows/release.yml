name: release

# Publishes to PyPI through trusted publishing (no API token). The PyPI
# publisher is configured for this workflow file and the `pypi` environment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          python-version: "3.11"
      - name: Tag must match package version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
      # Fails here, before PyPI (which cannot withdraw a release), when CHANGELOG.md has no
      # section for the tag. The notes stay out of dist/, which the publish step uploads whole.
      - name: Release notes from CHANGELOG.md
        run: |
          mkdir -p "${RUNNER_TEMP}/release-notes"
          uv run --no-project python scripts/release_notes.py "${GITHUB_REF_NAME#v}" \
            > "${RUNNER_TEMP}/release-notes/notes.md"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes/notes.md
          if-no-files-found: error
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/bag --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/hdl-bag/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "${GITHUB_REF_NAME}" --notes-file release-notes/notes.md

  # :main moves, so the image this release was validated against is pinned by re-tagging the
  # manifest behind :main (both architectures) with the git tag. Server side: no rebuild.
  pin-tools-image:
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image behind main with the release tag
        run: |
          repo=ghcr.io/hdl-tools/hdl-bag-tools
          docker buildx imagetools create --tag "$repo:${GITHUB_REF_NAME}" "$repo:main"
          docker buildx imagetools inspect "$repo:${GITHUB_REF_NAME}"
