name: release

# Publishes to PyPI through trusted publishing (no API token). The PyPI
# publisher is configured for this workflow file and the `pypi` environment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          python-version: "3.11"
      - name: Tag must match package version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/bag --version
          # PEP 639: the licensing docs the README and changelog link must reach the wheel.
          # files() and locate_file() are public API; the dist-info layout is not.
          /tmp/smoke/bin/python -c 'import importlib.metadata as m, sys; d = m.distribution("hdl-bag"); have = [str(p) for p in (d.files or [])]; want = ("licenses/docs/bom.md", "licenses/docs/licensing.md"); missing = [w for w in want if not any(h.endswith(w) and d.locate_file(h).stat().st_size for h in have)]; sys.exit("did not reach the installed wheel: " + ", ".join(missing) if missing else 0)'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/hdl-bag/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
