name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # The nightly (corpus with deep and alone tests, random seeds) is nightly.yml.
  workflow_dispatch:
    inputs:
      suite:
        description: EDA tests to run
        type: choice
        options: [full, smoke, deep]
        default: full
      select:
        description: Only tests whose names match this pytest -k expression, on one shard
        type: string
        default: ""
      select_shards:
        description: With select, spread the matching tests over this many jobs (1 if empty)
        type: string
        default: ""
      bmc_engine:
        description: Run the formal corpus's protocol bmc tasks on this SBY engine (D84)
        type: string
        default: ""
      arch:
        description: Which architecture to run the EDA tests on
        type: choice
        options: [amd64, arm64, both]
        default: amd64

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.14" }
          - { os: windows-2022, python: "3.11" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src tests scripts
      - name: SPDX headers
        shell: bash
        # Vendored third-party RTL keeps its upstream (SHL-0.51) headers.
        run: >-
          uv run python scripts/check_spdx.py
          $(git ls-files '*.py' '*.sv' ':(exclude)src/hdl_bag/rtl/vendor') tools/Dockerfile
      - run: uv run pytest

  golden:
    # Regenerates the demo_ss sample, recalculates it with LibreOffice and checks it
    # against tests/golden/demo_ss.xlsx. The recalculated file is uploaded so a schema
    # change can refresh the committed golden.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hdl-tools/hdl-bag-tools:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --locked
      - run: uv run bag template --sample -o out/demo_ss.xlsx
      - run: uv run --no-project python scripts/recalc.py out/demo_ss.xlsx out/demo_ss.recalc.xlsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-demo_ss
          path: out/demo_ss.recalc.xlsx
          if-no-files-found: error
      - run: uv run pytest tests/golden
        env:
          BAG_RECALC_WORKBOOK: out/demo_ss.recalc.xlsx

  vendor:
    # The vendored PULP tree must match Bender.lock exactly (scripts/vendor_pulp.py), and the
    # vendored ZipCPU formal properties their pinned commit (scripts/vendor_zipcpu.py).
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hdl-tools/hdl-bag-tools:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - run: uv run --no-project python scripts/vendor_pulp.py --check
      - run: uv run --no-project python scripts/vendor_zipcpu.py --check

  eda-shard:
    if: >-
      github.event_name != 'workflow_dispatch' || inputs.arch != 'arm64'
    # A pull request runs the smoke subset (tests/smoke.py), under 15 minutes even with a cold
    # cache, unless it carries the full-eda label (full-eda.yml runs the full list when the
    # label is added). The full list runs on every push to main and on demand, without the
    # deep tests (D74), on 12 jobs: about 373 minutes of tests no longer fit 4 jobs of 30
    # minutes (PR 6). suite=deep runs only the deep tests, two at a time per job with a 3 h
    # limit each, to measure what they cost without solvers competing for cores. The nightly
    # (everything, with the deep and alone tests) is nightly.yml; dispatch it on a branch to
    # run that set before a merge.
    uses: ./.github/workflows/eda-shards.yml
    with:
      marks: >-
        ${{ ((github.event_name == 'pull_request'
              && !contains(github.event.pull_request.labels.*.name, 'full-eda'))
             || (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke'))
            && 'eda and smoke'
            || ((github.event_name == 'workflow_dispatch' && inputs.suite == 'deep') && 'eda and deep')
            || ((github.event_name == 'workflow_dispatch' && inputs.select != '') && 'eda' || 'eda and not deep') }}
      # A select dispatch may name a deep or alone test (up to 5 h); the smoke subset stays
      # under 15 minutes; the full list's slowest job took 24 minutes (PR 6), so it gets 40.
      timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'deep') && 300 || (github.event_name == 'workflow_dispatch' && inputs.select != '') && 340 || ((github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-eda')) || (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke')) && 30 || 40 }}
      keyword: ${{ github.event_name == 'workflow_dispatch' && inputs.select || '' }}
      bmc-engine: ${{ github.event_name == 'workflow_dispatch' && inputs.bmc_engine || '' }}
      shards: ${{ (github.event_name == 'workflow_dispatch' && inputs.select != '') && (inputs.select_shards != '' && fromJSON(inputs.select_shards) || 1) || (github.event_name == 'workflow_dispatch' && inputs.suite == 'deep') && 16 || (github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-eda')) && 4 || (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke') && 4 || 12 }}
      workers: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'deep') && '2' || 'auto' }}
      deep-timeout: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'deep') && 10800 || 7200 }}
      save-cache: ${{ !(github.event_name == 'workflow_dispatch' && inputs.suite == 'deep') }}
    permissions:
      contents: read
      packages: read

  # The same tests on the arm64 tools image, which is what an Apple Silicon Mac runs. Only
  # the smoke subset by default: it doubles the per-PR EDA minutes and that is the ceiling
  # worth paying to catch an arm64-only regression where it is introduced. The full list on
  # arm64 is a deliberate dispatch (arch=arm64 or both).
  eda-shard-arm64:
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.arch == 'arm64' || inputs.arch == 'both'
    uses: ./.github/workflows/eda-shards.yml
    with:
      runner: ubuntu-24.04-arm
      arch: arm64
      marks: >-
        ${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')
            && 'eda and not deep' || 'eda and smoke' }}
      shards: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') && 12 || 4 }}
      timeout-minutes: ${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'full') && 40 || 30 }}
    permissions:
      contents: read
      packages: read

  eda:
    # The one check to require: passes only when every shard did, on both architectures. A
    # skipped architecture counts as passing, since a dispatch can ask for just one.
    needs: [eda-shard, eda-shard-arm64]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every architecture's shards passed or were not asked for
        run: |
          set -eu
          for r in '${{ needs.eda-shard.result }}' '${{ needs.eda-shard-arm64.result }}'; do
            case "$r" in
              success|skipped) ;;
              *) echo "eda shards: $r" >&2; exit 1 ;;
            esac
          done
