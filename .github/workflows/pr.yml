name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"  # nightly: the full EDA list
  workflow_dispatch:
    inputs:
      suite:
        description: EDA tests to run
        type: choice
        options: [full, smoke]
        default: full

permissions:
  contents: read

jobs:
  test:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-eda'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.14" }
          - { os: windows-2022, python: "3.11" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src tests scripts
      - name: SPDX headers
        shell: bash
        # Vendored third-party RTL keeps its upstream (SHL-0.51) headers.
        run: >-
          uv run python scripts/check_spdx.py
          $(git ls-files '*.py' '*.sv' ':(exclude)src/hdl_bag/rtl/vendor') tools/Dockerfile
      - run: uv run pytest

  golden:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-eda'
    # Regenerates the demo_ss sample, recalculates it with LibreOffice and checks it
    # against tests/golden/demo_ss.xlsx. The recalculated file is uploaded so a schema
    # change can refresh the committed golden.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hdl-tools/hdl-bag-tools:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --locked
      - run: uv run bag template --sample -o out/demo_ss.xlsx
      - run: uv run --no-project python scripts/recalc.py out/demo_ss.xlsx out/demo_ss.recalc.xlsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-demo_ss
          path: out/demo_ss.recalc.xlsx
          if-no-files-found: error
      - run: uv run pytest tests/golden
        env:
          BAG_RECALC_WORKBOOK: out/demo_ss.recalc.xlsx

  vendor:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-eda'
    # The vendored PULP tree must match Bender.lock exactly (scripts/vendor_pulp.py).
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hdl-tools/hdl-bag-tools:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - run: uv run --no-project python scripts/vendor_pulp.py --check

  eda-shard:
    # Lint flow and simulation tests against the pinned EDA tools: four parallel jobs
    # balanced by tests/eda_durations.json (pytest-split; refresh it with
    # scripts/eda_durations.py), each spread over the runner's cores with pytest-xdist
    # (every test has its own out/ directory). A pull request runs the smoke subset
    # (tests/smoke.py), under 15 minutes even with a cold cache; the full list runs on every
    # push to main, nightly, on demand, and on a pull request labelled full-eda.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-eda'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    container:
      image: ghcr.io/hdl-tools/hdl-bag-tools:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    env:
      # A cold C++ build is most of the time here, and Verilator's makefiles use ccache when
      # it is there. BASEDIR and NOHASHDIR let builds in different out/ directories share.
      CCACHE_DIR: /tmp/ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_NOHASHDIR: "true"
      EDA_MARKS: >-
        ${{ ((github.event_name == 'pull_request'
              && !contains(github.event.pull_request.labels.*.name, 'full-eda'))
             || (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke'))
            && 'eda and smoke' || 'eda' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-v2-${{ matrix.group }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v2-${{ matrix.group }}-
            ccache-v2-
      - run: uv sync --locked
      - run: ccache --zero-stats
      - run: >-
          CCACHE_BASEDIR="$PWD"
          uv run pytest -m "$EDA_MARKS" -n auto --splits 4 --group ${{ matrix.group }}
          --durations-path tests/eda_durations.json --splitting-algorithm least_duration
          --durations=0 --durations-min=0
      - run: ccache --show-stats
        if: always()

  eda:
    # The one check to require: passes only when every shard did.
    needs: eda-shard
    if: always() && (github.event.action != 'labeled' || github.event.label.name == 'full-eda')
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.eda-shard.result }}" = success
