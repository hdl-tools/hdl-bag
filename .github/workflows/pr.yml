name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.14" }
          - { os: windows-2022, python: "3.11" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src tests scripts
      - name: SPDX headers
        shell: bash
        run: uv run python scripts/check_spdx.py $(git ls-files '*.py') tools/Dockerfile
      - run: uv run pytest

  golden:
    # Regenerates the demo_ss sample, recalculates it with LibreOffice and checks it
    # against tests/golden/demo_ss.xlsx. The recalculated file is uploaded so a schema
    # change can refresh the committed golden.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hdl-tools/hdl-bag-tools:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --locked
      - run: uv run bag template --sample -o out/demo_ss.xlsx
      - run: uv run --no-project python scripts/recalc.py out/demo_ss.xlsx out/demo_ss.recalc.xlsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-demo_ss
          path: out/demo_ss.recalc.xlsx
          if-no-files-found: error
      - run: uv run pytest tests/golden
        env:
          BAG_RECALC_WORKBOOK: out/demo_ss.recalc.xlsx

  eda:
    # Lint flow and simulation tests against the pinned EDA tools (pytest -m eda).
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hdl-tools/hdl-bag-tools:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --locked --group sim
      - run: uv run pytest -m eda
