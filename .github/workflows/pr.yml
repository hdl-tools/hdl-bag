name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    # Interim nightly: the full EDA list only, restoring but never saving the ccache. Phase 5's
    # nightly.yml replaces it.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: EDA tests to run
        type: choice
        options: [full, smoke]
        default: full

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.14" }
          - { os: windows-2022, python: "3.11" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src tests scripts
      - name: SPDX headers
        shell: bash
        # Vendored third-party RTL keeps its upstream (SHL-0.51) headers.
        run: >-
          uv run python scripts/check_spdx.py
          $(git ls-files '*.py' '*.sv' ':(exclude)src/hdl_bag/rtl/vendor') tools/Dockerfile
      - run: uv run pytest

  golden:
    if: github.event_name != 'schedule'
    # Regenerates the demo_ss sample, recalculates it with LibreOffice and checks it
    # against tests/golden/demo_ss.xlsx. The recalculated file is uploaded so a schema
    # change can refresh the committed golden.
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hdl-tools/hdl-bag-tools:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - run: uv sync --locked
      - run: uv run bag template --sample -o out/demo_ss.xlsx
      - run: uv run --no-project python scripts/recalc.py out/demo_ss.xlsx out/demo_ss.recalc.xlsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-demo_ss
          path: out/demo_ss.recalc.xlsx
          if-no-files-found: error
      - run: uv run pytest tests/golden
        env:
          BAG_RECALC_WORKBOOK: out/demo_ss.recalc.xlsx

  vendor:
    if: github.event_name != 'schedule'
    # The vendored PULP tree must match Bender.lock exactly (scripts/vendor_pulp.py).
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/hdl-tools/hdl-bag-tools:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - run: uv run --no-project python scripts/vendor_pulp.py --check

  eda-shard:
    # A pull request runs the smoke subset (tests/smoke.py), under 15 minutes even with a cold
    # cache, unless it carries the full-eda label (full-eda.yml runs the full list when the
    # label is added). The full list runs on every push to main, nightly, and on demand.
    uses: ./.github/workflows/eda-shards.yml
    with:
      marks: >-
        ${{ ((github.event_name == 'pull_request'
              && !contains(github.event.pull_request.labels.*.name, 'full-eda'))
             || (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke'))
            && 'eda and smoke' || 'eda' }}
      save-cache: ${{ github.event_name != 'schedule' }}
    permissions:
      contents: read
      packages: read

  eda:
    # The one check to require: passes only when every shard did.
    needs: eda-shard
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.eda-shard.result }}" = success
