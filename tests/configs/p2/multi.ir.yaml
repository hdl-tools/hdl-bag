memory_map:
  - slave: ram
    region: mem
    base: '0x0000_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: ahb_m
  - slave: br_y
    region: win
    base: '0x4000_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: ahb_m
  - slave: uart
    region: regs
    base: '0x4000_0000'
    size: '0x0000_1000'
    access: RO
    secure: false
    fabric: p4
  - slave: spi
    region: regs
    base: '0x4000_1000'
    size: '0x0000_1000'
    access: RW
