      kind: fabric
      wrapper: multi_top
      rtl_name: u_ahb_m
    - instance: ahb_s
      kind: fabric
      wrapper: multi_top
      rtl_name: u_ahb_s
    - instance: br_n
      kind: bridge
      wrapper: multi_top
      rtl_name: u_br_n
    - instance: br_y
      kind: bridge
      wrapper: multi_top
      rtl_name: u_br_y
    - instance: p3
      kind: fabric
      wrapper: multi_top
      rtl_name: u_p3
    - instance: p4
      kind: fabric
      wrapper: multi_top
      rtl_name: u_p4
wrapper:
