      kind: fabric
      wrapper: apb4_rules_top
      rtl_name: u_apb
wrapper:
  top: apb4_rules_top
  port_style: flat
  signal_pattern: '{port}_{proto}_{signal}'
  clock_reset_ports: one per domain
  package: apb4_rules_pkg
  file_header: header.txt
  extra_inputs: []
  adapter_placement: with fabric
  adapter_naming: '{from}_{type}_2_{to}'
  subwrapper_port_naming: '{instance}_{proto}_{signal}'
  ports:
    - port: cpu
      exposed: true
      prefix: null
    - port: dual0
      exposed: true
      prefix: null
    - port: ro0
      exposed: true
      prefix: null
    - port: sec0
      exposed: true
      prefix: null
    - port: wo0
      exposed: true
      prefix: null
provenance:
