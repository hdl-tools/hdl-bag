hierarchy:
  top: nested_deep_top
  wrappers:
    - name: l0
      parent: nested_deep_top
    - name: l1
      parent: l0
    - name: l2
      parent: l1
    - name: l3
      parent: l2
  placement:
    - instance: ahb
      kind: fabric
      wrapper: l1
      rtl_name: u_ahb_core
    - instance: apb_a
      kind: fabric
      wrapper: l2
      rtl_name: u_mux
    - instance: apb_b
      kind: fabric
      wrapper: l3
