schema: '0.6'
project:
  name: nested_deep
  revision: p2
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/nested_deep
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_slow
    mhz: 100
    source: top port
    domain: D_SLOW
    reset: rst_slow_n
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_slow_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SLOW
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: ahb
    protocol: AHB-Lite
    topology: single-layer
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_ahb_lite_bus
    backing_ip: in-house template
    external_module: null
    master_ports:
      - index: 0
        port: mcu
        priority: null
    slave_ports:
      - index: 0
        port: tcm
        priority: null
      - index: 1
        port: br_a
        priority: null
      - index: 2
        port: br_b
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: tcm
        region: mem
        base: '0x0000_0000'
        end: '0x0000_FFFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: br_a
        region: win
        base: '0x4000_0000'
        end: '0x4000_FFFF'
        access: RW
        secure: false
      - slave_port: 2
        slave: br_b
        region: win
        base: '0x5000_0000'
        end: '0x5000_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: mcu
        miss: HRESP_ERROR
        default_slave: null
        aliases:
          - base: '0x0010_0000'
            size: '0x0000_1000'
            to: '0x5000_1000'
            enable: boot_i
  - name: apb_a
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    external_module: null
    master_ports:
      - index: 0
        port: br_a
        priority: null
    slave_ports:
      - index: 0
        port: timer
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: timer
        region: regs
        base: '0x4000_0000'
        end: '0x4000_0FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_a
        miss: PSLVERR
        default_slave: null
        aliases: []
  - name: apb_b
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 32
    domain: D_SLOW
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    external_module: null
    master_ports:
      - index: 0
        port: br_b
        priority: null
    slave_ports:
      - index: 0
        port: wdt
        priority: null
      - index: 1
        port: rtc
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: wdt
        region: regs
        base: '0x5000_0000'
        end: '0x5000_0FFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: rtc
        region: regs
        base: '0x5000_1000'
        end: '0x5000_1FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_b
        miss: PSLVERR
        default_slave: null
        aliases: []
masters:
  - name: mcu
    protocol: AHB-Lite
    fabric: ahb
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: rtc
    protocol: APB4
    fabric: apb_b
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SLOW
    error_response: PSLVERR
    wait_states: 0
  - name: tcm
    protocol: AHB-Lite
    fabric: ahb
    data_width: 32
    addr_width: 16
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: HRESP_ERROR
    wait_states: 0
  - name: timer
    protocol: APB4
    fabric: apb_a
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: PSLVERR
    wait_states: 0
  - name: wdt
    protocol: APB4
    fabric: apb_b
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SLOW
    error_response: PSLVERR
    wait_states: 0
bridges:
  - name: br_a
    template: bag_ahb2apb
    upstream: ahb
    downstream: apb_a
    window_base: '0x4000_0000'
    pass_through: true
    fifo_depth: 0
    upstream_protocol: AHB-Lite
    downstream_protocol: APB4
    upstream_width: 32
    downstream_width: 32
    cdc: false
  - name: br_b
    template: bag_ahb2apb
    upstream: ahb
    downstream: apb_b
    window_base: '0x5000_0000'
    pass_through: true
    fifo_depth: 0
    upstream_protocol: AHB-Lite
    downstream_protocol: APB4
    upstream_width: 32
    downstream_width: 32
    cdc: true
adapters: []
