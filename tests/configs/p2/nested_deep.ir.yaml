memory_map:
  - slave: tcm
    region: mem
    base: '0x0000_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: ahb
  - slave: br_a
    region: win
    base: '0x4000_0000'
    size: '0x0001_0000'
    access: RW
