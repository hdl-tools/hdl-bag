schema: '0.5'
project:
  name: ahb2apb_cdc
  revision: p2
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/ahb2apb_cdc
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_fast
    mhz: 100
    source: top port
    domain: D_FAST
    reset: rst_fast_n
  - name: clk_slow
    mhz: 100
    source: top port
    domain: D_SLOW
    reset: rst_slow
resets:
  - name: rst_fast_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_FAST
  - name: rst_slow
    polarity: active-high
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SLOW
fabrics:
  - name: ahb
    protocol: AHB-Lite
    topology: single-layer
    data_width: 64
    addr_width: 32
    domain: D_FAST
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_ahb_lite_bus
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: cpu
        priority: null
    slave_ports:
      - index: 0
        port: mem
        priority: null
      - index: 1
        port: br
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: mem
        region: ram
        base: '0x0000_0000'
        end: '0x0000_FFFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: br
        region: periph
        base: '0x9000_0000'
        end: '0x9000_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: cpu
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
  - name: apb
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 16
    domain: D_SLOW
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: br
        priority: null
    slave_ports:
      - index: 0
        port: uart
        priority: null
      - index: 1
        port: gpio
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: uart
        region: regs
        base: '0x9000_0000'
        end: '0x9000_0FFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: gpio
        region: regs
        base: '0x9000_1000'
        end: '0x9000_1FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br
        miss: PSLVERR
        default_slave: null
        aliases:
          - base: '0x9000_8000'
            size: '0x0000_1000'
            to: '0x9000_1000'
            enable: remap_i
masters:
  - name: cpu
    protocol: AHB-Lite
    fabric: ahb
    data_width: 64
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_FAST
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: gpio
    protocol: APB4
    fabric: apb
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SLOW
    error_response: PSLVERR
    wait_states: 0
  - name: mem
    protocol: AHB-Lite
    fabric: ahb
    data_width: 64
    addr_width: 16
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_FAST
    error_response: HRESP_ERROR
    wait_states: 0
  - name: uart
    protocol: APB4
    fabric: apb
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SLOW
    error_response: PSLVERR
    wait_states: 0
bridges:
  - name: br
    template: bag_ahb2apb
    upstream: ahb
    downstream: apb
    window_base: '0x9000_0000'
    pass_through: false
    fifo_depth: 0
    upstream_protocol: AHB-Lite
    downstream_protocol: APB4
    upstream_width: 64
    downstream_width: 32
    cdc: true
adapters: []
port_options:
  - port: br
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
  - port: cpu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: gpio
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
  - port: mem
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: uart
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
user_ports: []
memory_map:
  - slave: mem
    region: ram
    base: '0x0000_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: ahb
  - slave: br
    region: periph
    base: '0x9000_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: ahb
  - slave: uart
    region: regs
    base: '0x9000_0000'
    size: '0x0000_1000'
    access: RW
    secure: false
    fabric: apb
  - slave: gpio
    region: regs
    base: '0x9000_1000'
    size: '0x0000_1000'
    access: RW
    secure: false
    fabric: apb
hierarchy:
  top: ahb2apb_cdc_top
  wrappers: []
  placement:
    - instance: ahb
      kind: fabric
      wrapper: ahb2apb_cdc_top
      rtl_name: u_ahb
    - instance: apb
      kind: fabric
      wrapper: ahb2apb_cdc_top
      rtl_name: u_apb
    - instance: br
      kind: bridge
      wrapper: ahb2apb_cdc_top
      rtl_name: u_br
wrapper:
  top: ahb2apb_cdc_top
  port_style: flat
  signal_pattern: '{port}_{proto}_{signal}'
  clock_reset_ports: one per domain
  package: ahb2apb_cdc_pkg
  file_header: header.txt
  extra_inputs:
    - remap_i
  adapter_placement: with fabric
  adapter_naming: '{from}_{type}_2_{to}'
  subwrapper_port_naming: '{instance}_{proto}_{signal}'
  ports:
    - port: br
      exposed: false
      prefix: null
    - port: cpu
      exposed: true
      prefix: null
    - port: gpio
      exposed: true
      prefix: null
    - port: mem
      exposed: true
      prefix: null
    - port: uart
      exposed: true
      prefix: null
provenance:
  bag_version: 0.0.1
  source: ahb2apb_cdc.xlsx
  sha256: f4e7d89d796c6f1e0354173829c8f44dbe9d0387bd67ea9cb53819a6c707717e
