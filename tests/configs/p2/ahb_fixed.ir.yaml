  - name: m2
    protocol: AHB-Lite
    fabric: ahb
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_H
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
