schema: '0.3'
project:
  name: ahb_fixed
  revision: p2
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/ahb_fixed
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_h
    mhz: 100
    source: top port
    domain: D_H
    reset: rst_h_n
resets:
  - name: rst_h_n
    polarity: active-low
    assertion: sync
    deassertion: async
    source: top port
    domain: D_H
fabrics:
  - name: ahb
    protocol: AHB-Lite
    topology: single-layer
    data_width: 32
    addr_width: 32
    domain: D_H
    arbitration: fixed-priority
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_ahb_lite_bus
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: m0
        priority: 1
      - index: 1
        port: m1
        priority: 2
      - index: 2
        port: m2
        priority: 0
    slave_ports:
      - index: 0
        port: s0
        priority: null
      - index: 1
        port: s1
        priority: null
      - index: 2
        port: s2
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: s0
        region: mem
        base: '0x2000_0000'
        end: '0x2000_FFFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: s1
        region: mem
        base: '0x2001_0000'
        end: '0x2001_FFFF'
        access: RW
        secure: false
      - slave_port: 2
        slave: s2
        region: mem
        base: '0x2002_0000'
        end: '0x2002_FFFF'
        access: RW
        secure: true
    access_rules: []
    decode:
      - master: m0
        miss: HRESP_ERROR
        default_slave: null
        aliases:
          - base: '0x0000_0000'
            size: '0x0000_1000'
            to: '0x2000_0000'
            enable: always
      - master: m1
        miss: default-slave
        default_slave: s1
        aliases:
          - base: '0x0000_0000'
            size: '0x0000_1000'
            to: '0x2001_0000'
            enable: boot_a_i
      - master: m2
        miss: HRESP_ERROR
        default_slave: null
        aliases:
          - base: '0x0001_0000'
            size: '0x0000_1000'
            to: '0x2002_0000'
            enable: boot_b_i
masters:
  - name: m0
    protocol: AHB-Lite
    fabric: ahb
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_H
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: m1
    protocol: AHB-Lite
    fabric: ahb
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_H
