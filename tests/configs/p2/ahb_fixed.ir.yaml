    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
memory_map:
  - slave: s0
    region: mem
    base: '0x2000_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: ahb
  - slave: s1
    region: mem
    base: '0x2001_0000'
    size: '0x0001_0000'
    access: RW
