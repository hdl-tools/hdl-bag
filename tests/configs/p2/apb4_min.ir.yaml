schema: '0.5'
project:
  name: apb4_min
  revision: p2
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/apb4_min
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_a
    mhz: 100
    source: top port
    domain: D_A
    reset: rst_a
  - name: clk_u
    mhz: 100
    source: top port
    domain: D_UNUSED
    reset: rst_u_n
resets:
  - name: rst_a
    polarity: active-high
    assertion: async
    deassertion: async
    source: top port
    domain: D_A
  - name: rst_u_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_UNUSED
fabrics:
  - name: apb
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 12
    domain: D_A
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: m0
        priority: null
    slave_ports:
      - index: 0
        port: s0
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: s0
        region: regs
        base: '0x0000_0000'
        end: '0x0000_07FF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: m0
        miss: PSLVERR
        default_slave: null
        aliases:
          - base: '0x0000_0800'
            size: '0x0000_0100'
            to: '0x0000_0000'
            enable: alias_i
masters:
  - name: m0
    protocol: APB4
    fabric: apb
    data_width: 32
    addr_width: 12
    id_width: null
    user_width: 0
    domain: D_A
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: s0
    protocol: APB4
    fabric: apb
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_A
    error_response: PSLVERR
    wait_states: 0
bridges: []
adapters: []
port_options:
  - port: m0
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
  - port: s0
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
user_ports: []
memory_map:
  - slave: s0
    region: regs
    base: '0x0000_0000'
    size: '0x0000_0800'
    access: RW
    secure: false
    fabric: apb
hierarchy:
  top: apb4_min_top
  wrappers: []
  placement:
    - instance: apb
      kind: fabric
      wrapper: apb4_min_top
      rtl_name: u_apb
wrapper:
  top: apb4_min_top
  port_style: flat
  signal_pattern: '{port}_{proto}_{signal}'
  clock_reset_ports: one per domain
  package: apb4_min_pkg
  file_header: header.txt
  extra_inputs:
    - alias_i
    - spare_i
  adapter_placement: with fabric
  adapter_naming: '{from}_{type}_2_{to}'
  subwrapper_port_naming: '{instance}_{proto}_{signal}'
  ports:
    - port: m0
      exposed: true
      prefix: null
    - port: s0
      exposed: true
      prefix: null
provenance:
  bag_version: 0.0.1
  source: apb4_min.xlsx
  sha256: 1fd30dff5e1a9fac368df89e063b77d7e78dca4fc77426da92ef02fe051aa8b1
