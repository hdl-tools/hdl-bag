    topology: single-layer
    data_width: 64
    addr_width: 24
    domain: D_PER
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_ahb_lite_bus
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: br_ahb
        priority: null
    slave_ports:
      - index: 0
        port: sram
        priority: null
      - index: 1
        port: br_aon
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: sram
        region: mem
        base: '0x4000_0000'
        end: '0x4000_FFFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: br_aon
        region: win
        base: '0x4010_0000'
        end: '0x4010_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_ahb
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
  - name: aon
    protocol: AXI4
    topology: crossbar
    data_width: 32
    addr_width: 32
    domain: D_AON
    arbitration: round-robin
    latency_mode: NO_LATENCY
    max_mst_trans: 2
    max_slv_trans: 2
    midpoint: null
    template: bag_axi_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: br_aon
        priority: null
    slave_ports:
      - index: 0
        port: wdt
        priority: null
    id_width:
      master_side: 1
      slave_side: 1
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: wdt
        region: regs
        base: '0x4010_1000'
        end: '0x4010_1FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_aon
        miss: DECERR
        default_slave: null
        aliases: []
  - name: dbg_apb
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 32
    domain: D_AON
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: dbg
        priority: null
    slave_ports:
      - index: 0
        port: br_lite
        priority: null
      - index: 1
        port: br_rom
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: br_lite
        region: win
        base: '0x5000_0000'
        end: '0x5000_FFFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: br_rom
        region: win
        base: '0x6000_0000'
        end: '0x6000_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: dbg
        miss: PSLVERR
        default_slave: null
        aliases: []
  - name: lite
    protocol: AXI4-Lite
    topology: crossbar
    data_width: 64
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: NO_LATENCY
    max_mst_trans: 2
    max_slv_trans: 2
    midpoint: null
    template: bag_axil_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: br_lite
        priority: null
    slave_ports:
      - index: 0
        port: pmu
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
