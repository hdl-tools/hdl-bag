        secure: false
    access_rules: []
    decode:
      - master: br_rom
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
  - name: xbar
    protocol: AXI4
    topology: crossbar
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: NO_LATENCY
    max_mst_trans: 4
    max_slv_trans: 4
    midpoint: null
    template: bag_axi_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: cpu
        priority: null
    slave_ports:
      - index: 0
        port: ram
        priority: null
      - index: 1
        port: br_ahb
        priority: null
    id_width:
