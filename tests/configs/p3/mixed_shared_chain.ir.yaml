schema: '0.6'
project:
  name: mixed_shared_chain
  revision: p3
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/mixed_shared_chain
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: ahb
    protocol: AHB-Lite
    topology: single-layer
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_ahb_lite_bus
    backing_ip: in-house template
    external_module: null
    master_ports:
      - index: 0
        port: br_ahb
        priority: null
    slave_ports:
      - index: 0
        port: sram
        priority: null
      - index: 1
        port: br_lp
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: sram
        region: mem
        base: '0x4000_0000'
        end: '0x4000_FFFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: br_lp
        region: win
        base: '0x4001_0000'
        end: '0x4001_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_ahb
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
  - name: bus
    protocol: AXI4
    topology: shared-bus
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: fixed-priority
    latency_mode: null
    max_mst_trans: 4
    max_slv_trans: 4
    midpoint:
      fifo_depth: 2
      slice: cut
    template: bag_axi_shared_bus
    backing_ip: PULP
    external_module: null
    master_ports:
      - index: 0
        port: cpu
        priority: 1
      - index: 1
        port: dma
        priority: 0
    slave_ports:
      - index: 0
        port: ram
        priority: null
      - index: 1
        port: br_ahb
        priority: null
    id_width:
      master_side: 2
      slave_side: 3
    max_parallel: 1
    addr_rules:
      - slave_port: 1
        slave: br_ahb
        region: win
        base: '0x4000_0000'
        end: '0x400F_FFFF'
        access: RW
        secure: false
      - slave_port: 0
        slave: ram
        region: mem
        base: '0x8000_0000'
        end: '0x800F_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: cpu
        miss: DECERR
        default_slave: null
        aliases: []
      - master: dma
        miss: SLVERR
        default_slave: null
        aliases: []
  - name: lp
    protocol: APB3
    topology: decoder-mux
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    external_module: null
    master_ports:
      - index: 0
        port: br_lp
        priority: null
    slave_ports:
      - index: 0
        port: tmr
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: tmr
        region: regs
        base: '0x4001_0000'
        end: '0x4001_0FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_lp
        miss: PSLVERR
        default_slave: null
        aliases: []
masters:
  - name: cpu
    protocol: AXI4
    fabric: bus
    data_width: 32
    addr_width: 32
    id_width: 2
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: dma
    protocol: AXI4
    fabric: bus
    data_width: 32
    addr_width: 32
    id_width: 2
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: ram
    protocol: AXI4
    fabric: bus
    data_width: 32
    addr_width: 32
    id_width: 3
    id_width_auto: true
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: sram
    protocol: AHB-Lite
    fabric: ahb
    data_width: 32
    addr_width: 16
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: HRESP_ERROR
    wait_states: 0
  - name: tmr
    protocol: APB3
    fabric: lp
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: PSLVERR
    wait_states: 0
bridges:
  - name: br_ahb
    template: bag_axi2ahb
    upstream: bus
    downstream: ahb
    window_base: '0x4000_0000'
    pass_through: true
    fifo_depth: 0
    upstream_protocol: AXI4
    downstream_protocol: AHB-Lite
    upstream_width: 32
    downstream_width: 32
    cdc: false
  - name: br_lp
    template: bag_ahb2apb
    upstream: ahb
    downstream: lp
    window_base: '0x4001_0000'
    pass_through: false
    fifo_depth: 0
    upstream_protocol: AHB-Lite
    downstream_protocol: APB3
    upstream_width: 32
    downstream_width: 32
    cdc: false
adapters: []
port_options:
  - port: br_ahb
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: br_lp
    fifo_depth: 0
    slice: none
    prot: n/a
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: drive
  - port: cpu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: dma
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: ram
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: sram
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: tmr
    fifo_depth: 0
    slice: none
    prot: n/a
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: drive
user_ports: []
memory_map:
  - slave: sram
    region: mem
    base: '0x4000_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: ahb
  - slave: br_ahb
    region: win
    base: '0x4000_0000'
    size: '0x0010_0000'
    access: RW
    secure: false
    fabric: bus
  - slave: br_lp
    region: win
    base: '0x4001_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: ahb
  - slave: tmr
    region: regs
    base: '0x4001_0000'
    size: '0x0000_1000'
    access: RW
    secure: false
    fabric: lp
  - slave: ram
    region: mem
    base: '0x8000_0000'
    size: '0x0010_0000'
    access: RW
    secure: false
    fabric: bus
hierarchy:
  top: mixed_shared_chain_top
  wrappers: []
  placement:
    - instance: ahb
      kind: fabric
      wrapper: mixed_shared_chain_top
      rtl_name: u_ahb
    - instance: br_ahb
      kind: bridge
      wrapper: mixed_shared_chain_top
      rtl_name: u_br_ahb
    - instance: br_lp
      kind: bridge
      wrapper: mixed_shared_chain_top
      rtl_name: u_br_lp
    - instance: bus
      kind: fabric
      wrapper: mixed_shared_chain_top
      rtl_name: u_bus
    - instance: lp
      kind: fabric
      wrapper: mixed_shared_chain_top
      rtl_name: u_lp
wrapper:
  top: mixed_shared_chain_top
  port_style: flat
  signal_pattern: '{port}_{proto}_{signal}'
  clock_reset_ports: one per domain
  package: mixed_shared_chain_pkg
  file_header: header.txt
  extra_inputs: []
  adapter_placement: with fabric
  adapter_naming: '{from}_{type}_2_{to}'
  subwrapper_port_naming: '{instance}_{proto}_{signal}'
  ports:
    - port: br_ahb
      exposed: false
      prefix: null
    - port: br_lp
      exposed: false
      prefix: null
    - port: cpu
      exposed: true
      prefix: null
    - port: dma
      exposed: true
      prefix: null
    - port: ram
      exposed: true
      prefix: null
    - port: sram
      exposed: true
      prefix: null
    - port: tmr
      exposed: true
      prefix: null
provenance:
  bag_version: 0.0.1
  source: mixed_shared_chain.xlsx
  sha256: 4604c2a9d355a440c79b11e263555b774febae4141e02223b8abe35d29bdd184
