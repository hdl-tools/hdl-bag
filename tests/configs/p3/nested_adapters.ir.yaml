schema: '0.6'
project:
  name: nested_adapters
  revision: p3
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/nested_adapters
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_cpu
    mhz: 100
    source: top port
    domain: D_CPU
    reset: rst_cpu_n
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_cpu_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_CPU
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: per
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    external_module: null
    master_ports:
      - index: 0
        port: br_per
        priority: null
    slave_ports:
      - index: 0
        port: uart
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: uart
        region: regs
        base: '0x4000_0000'
        end: '0x4000_0FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_per
        miss: PSLVERR
        default_slave: null
        aliases: []
  - name: xbar
    protocol: AXI4
    topology: crossbar
    data_width: 64
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: CUT_ALL_AX
    max_mst_trans: 4
    max_slv_trans: 4
    midpoint: null
    template: bag_axi_xbar
    backing_ip: PULP
    external_module: null
    master_ports:
      - index: 0
        port: cpu
        priority: null
      - index: 1
        port: dbg
        priority: null
    slave_ports:
      - index: 0
        port: ram
        priority: null
      - index: 1
        port: br_per
        priority: null
    id_width:
      master_side: 3
      slave_side: 4
    max_parallel: 2
    addr_rules:
      - slave_port: 1
        slave: br_per
        region: win
        base: '0x4000_0000'
        end: '0x4000_FFFF'
        access: RW
        secure: false
      - slave_port: 0
        slave: ram
        region: mem
        base: '0x8000_0000'
        end: '0x800F_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: cpu
        miss: DECERR
        default_slave: null
        aliases: []
      - master: dbg
        miss: SLVERR
        default_slave: null
        aliases: []
masters:
  - name: cpu
    protocol: AXI4
    fabric: xbar
    data_width: 32
    addr_width: 32
    id_width: 3
    user_width: 0
    domain: D_CPU
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: dbg
    protocol: AXI4-Lite
    fabric: xbar
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: ram
    protocol: AXI4
    fabric: xbar
    data_width: 128
    addr_width: 32
    id_width: 4
    id_width_auto: true
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: uart
    protocol: APB4
    fabric: per
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: PSLVERR
    wait_states: 0
bridges:
  - name: br_per
    template: bag_axi2apb
    upstream: xbar
    downstream: per
    window_base: '0x4000_0000'
    pass_through: false
    fifo_depth: 0
    upstream_protocol: AXI4
    downstream_protocol: APB4
    upstream_width: 64
    downstream_width: 32
    cdc: false
adapters:
  - name: cpu_cdc_2_xbar
    type: cdc
    port: cpu
    fabric: xbar
    chain_index: 0
    template: bag_cdc
    params:
      from: D_CPU
      to: D_SYS
    placed_in: ss_a
    rtl_name: u_cpu_cdc_2_xbar
  - name: cpu_dw_2_xbar
    type: dw
    port: cpu
    fabric: xbar
    chain_index: 1
    template: bag_dw
    params:
      from: 32
      to: 64
    placed_in: ss_b
    rtl_name: u_cpu_dw_2_xbar
  - name: dbg_pc_2_xbar
    type: pc
    port: dbg
    fabric: xbar
    chain_index: 0
    template: bag_pc
    params:
      from: AXI4-Lite
      to: AXI4
    placed_in: ss_b
    rtl_name: u_dbg_pc_2_xbar
  - name: dbg_dw_2_xbar
    type: dw
    port: dbg
    fabric: xbar
    chain_index: 1
    template: bag_dw
    params:
      from: 32
      to: 64
    placed_in: ss_b
    rtl_name: u_dbg_dw_2_xbar
  - name: xbar_dw_2_ram
    type: dw
    port: ram
    fabric: xbar
    chain_index: 0
    template: bag_dw
    params:
      from: 64
      to: 128
    placed_in: ss_d
    rtl_name: u_xbar_dw_2_ram
  - name: xbar_fifo_2_ram
    type: fifo
    port: ram
    fabric: xbar
    chain_index: 1
    template: bag_fifo
    params:
      depth: 2
    placed_in: ss_c
    rtl_name: u_ram_fifo
  - name: xbar_cut_2_ram
    type: cut
    port: ram
    fabric: xbar
    chain_index: 2
    template: bag_cut
    params:
      stages: 2
    placed_in: ss_d
    rtl_name: u_xbar_cut_2_ram
port_options:
  - port: br_per
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
  - port: cpu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: dbg
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: ram
    fifo_depth: 2
    slice: multicut-2
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: uart
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
user_ports: []
memory_map:
  - slave: uart
    region: regs
    base: '0x4000_0000'
    size: '0x0000_1000'
    access: RW
    secure: false
    fabric: per
  - slave: br_per
    region: win
    base: '0x4000_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: xbar
  - slave: ram
    region: mem
    base: '0x8000_0000'
    size: '0x0010_0000'
    access: RW
    secure: false
    fabric: xbar
hierarchy:
  top: nested_adapters_top
  wrappers:
    - name: ss_a
      parent: nested_adapters_top
    - name: ss_b
      parent: ss_a
    - name: ss_c
      parent: nested_adapters_top
    - name: ss_d
      parent: ss_c
  placement:
    - instance: br_per
      kind: bridge
      wrapper: ss_c
      rtl_name: u_br_per
    - instance: cpu_cdc_2_xbar
      kind: adapter
      wrapper: ss_a
      rtl_name: u_cpu_cdc_2_xbar
    - instance: cpu_dw_2_xbar
      kind: adapter
      wrapper: ss_b
      rtl_name: u_cpu_dw_2_xbar
    - instance: dbg_dw_2_xbar
      kind: adapter
      wrapper: ss_b
      rtl_name: u_dbg_dw_2_xbar
    - instance: dbg_pc_2_xbar
      kind: adapter
      wrapper: ss_b
      rtl_name: u_dbg_pc_2_xbar
    - instance: per
      kind: fabric
      wrapper: ss_a
      rtl_name: u_per
    - instance: xbar
      kind: fabric
      wrapper: ss_b
      rtl_name: u_xbar
    - instance: xbar_cut_2_ram
      kind: adapter
      wrapper: ss_d
      rtl_name: u_xbar_cut_2_ram
    - instance: xbar_dw_2_ram
      kind: adapter
      wrapper: ss_d
      rtl_name: u_xbar_dw_2_ram
    - instance: xbar_fifo_2_ram
      kind: adapter
      wrapper: ss_c
      rtl_name: u_ram_fifo
wrapper:
  top: nested_adapters_top
  port_style: flat
  signal_pattern: '{port}_{proto}_{signal}'
  clock_reset_ports: one per domain
  package: nested_adapters_pkg
  file_header: header.txt
  extra_inputs: []
  adapter_placement: with fabric
  adapter_naming: '{from}_{type}_2_{to}'
  subwrapper_port_naming: '{instance}_{proto}_{signal}'
  ports:
    - port: br_per
      exposed: false
      prefix: null
    - port: cpu
      exposed: true
      prefix: null
    - port: dbg
      exposed: true
      prefix: null
    - port: ram
      exposed: true
      prefix: null
    - port: uart
      exposed: true
      prefix: null
provenance:
  bag_version: 0.0.1
  source: nested_adapters.xlsx
  sha256: 57f6cbe116d8ad7c1927e5289784ff2c23b65440f637f6f58d99bcad342d1bfa
