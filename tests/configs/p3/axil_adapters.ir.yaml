schema: '0.5'
project:
  name: axil_adapters
  revision: p3
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/axil_adapters
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_aon
    mhz: 100
    source: top port
    domain: D_AON
    reset: rst_aon_n
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_aon_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_AON
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: cfg
    protocol: AXI4-Lite
    topology: crossbar
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: NO_LATENCY
    max_mst_trans: 2
    max_slv_trans: 2
    midpoint: null
    template: bag_axil_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: cpu
        priority: null
      - index: 1
        port: dsp
        priority: null
      - index: 2
        port: aon
        priority: null
    slave_ports:
      - index: 0
        port: buf
        priority: null
      - index: 1
        port: mem
        priority: null
    id_width: null
    max_parallel: 2
    addr_rules:
      - slave_port: 0
        slave: buf
        region: regs
        base: '0x2000_0000'
        end: '0x2000_3FFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: mem
        region: mem
        base: '0x2001_0000'
        end: '0x2001_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: aon
        miss: DECERR
        default_slave: null
        aliases: []
      - master: cpu
        miss: DECERR
        default_slave: null
        aliases: []
      - master: dsp
        miss: SLVERR
        default_slave: null
        aliases: []
masters:
  - name: aon
    protocol: AXI4-Lite
    fabric: cfg
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_AON
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: cpu
    protocol: AXI4
    fabric: cfg
    data_width: 64
    addr_width: 32
    id_width: 4
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: dsp
    protocol: AXI4-Lite
    fabric: cfg
    data_width: 64
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: buf
    protocol: AXI4-Lite
    fabric: cfg
    data_width: 64
    addr_width: 16
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: mem
    protocol: AXI4
    fabric: cfg
    data_width: 64
    addr_width: 16
    id_width: null
    id_width_auto: true
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
bridges: []
adapters:
  - name: aon_cdc_2_cfg
    type: cdc
    port: aon
    fabric: cfg
    chain_index: 0
    template: bag_cdc
    params:
      from: D_AON
      to: D_SYS
    placed_in: axil_adapters_top
    rtl_name: u_aon_cdc_2_cfg
  - name: aon_cut_2_cfg
    type: cut
    port: aon
    fabric: cfg
    chain_index: 1
    template: bag_cut
    params:
      stages: 1
    placed_in: axil_adapters_top
    rtl_name: u_aon_cut_2_cfg
  - name: cfg_dw_2_buf
    type: dw
    port: buf
    fabric: cfg
    chain_index: 0
    template: bag_dw
    params:
      from: 32
      to: 64
    placed_in: axil_adapters_top
    rtl_name: u_cfg_dw_2_buf
  - name: cfg_fifo_2_buf
    type: fifo
    port: buf
    fabric: cfg
    chain_index: 1
    template: bag_fifo
    params:
      depth: 2
    placed_in: axil_adapters_top
    rtl_name: u_cfg_fifo_2_buf
  - name: cpu_dw_2_cfg
    type: dw
    port: cpu
    fabric: cfg
    chain_index: 0
    template: bag_dw
    params:
      from: 64
      to: 32
    placed_in: axil_adapters_top
    rtl_name: u_cpu_dw_2_cfg
  - name: cpu_pc_2_cfg
    type: pc
    port: cpu
    fabric: cfg
    chain_index: 1
    template: bag_pc
    params:
      from: AXI4
      to: AXI4-Lite
    placed_in: axil_adapters_top
    rtl_name: u_cpu_pc_2_cfg
  - name: dsp_dw_2_cfg
    type: dw
    port: dsp
    fabric: cfg
    chain_index: 0
    template: bag_dw
    params:
      from: 64
      to: 32
    placed_in: axil_adapters_top
    rtl_name: u_dsp_dw_2_cfg
  - name: cfg_dw_2_mem
    type: dw
    port: mem
    fabric: cfg
    chain_index: 0
    template: bag_dw
    params:
      from: 32
      to: 64
    placed_in: axil_adapters_top
    rtl_name: u_cfg_dw_2_mem
  - name: cfg_pc_2_mem
    type: pc
    port: mem
    fabric: cfg
    chain_index: 1
    template: bag_pc
    params:
      from: AXI4-Lite
      to: AXI4
    placed_in: axil_adapters_top
    rtl_name: u_cfg_pc_2_mem
port_options:
  - port: aon
    fifo_depth: 0
    slice: cut
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: buf
    fifo_depth: 2
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: cpu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: dsp
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: mem
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
user_ports: []
memory_map:
  - slave: buf
    region: regs
    base: '0x2000_0000'
    size: '0x0000_4000'
    access: RW
    secure: false
    fabric: cfg
  - slave: mem
    region: mem
    base: '0x2001_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: cfg
hierarchy:
  top: axil_adapters_top
  wrappers: []
  placement:
    - instance: aon_cdc_2_cfg
      kind: adapter
      wrapper: axil_adapters_top
      rtl_name: u_aon_cdc_2_cfg
    - instance: aon_cut_2_cfg
      kind: adapter
      wrapper: axil_adapters_top
      rtl_name: u_aon_cut_2_cfg
    - instance: cfg
      kind: fabric
      wrapper: axil_adapters_top
      rtl_name: u_cfg
    - instance: cfg_dw_2_buf
      kind: adapter
      wrapper: axil_adapters_top
      rtl_name: u_cfg_dw_2_buf
    - instance: cfg_dw_2_mem
      kind: adapter
      wrapper: axil_adapters_top
      rtl_name: u_cfg_dw_2_mem
    - instance: cfg_fifo_2_buf
      kind: adapter
      wrapper: axil_adapters_top
      rtl_name: u_cfg_fifo_2_buf
    - instance: cfg_pc_2_mem
      kind: adapter
      wrapper: axil_adapters_top
      rtl_name: u_cfg_pc_2_mem
    - instance: cpu_dw_2_cfg
      kind: adapter
      wrapper: axil_adapters_top
      rtl_name: u_cpu_dw_2_cfg
    - instance: cpu_pc_2_cfg
      kind: adapter
      wrapper: axil_adapters_top
      rtl_name: u_cpu_pc_2_cfg
    - instance: dsp_dw_2_cfg
      kind: adapter
      wrapper: axil_adapters_top
      rtl_name: u_dsp_dw_2_cfg
wrapper:
  top: axil_adapters_top
  port_style: flat
  signal_pattern: '{port}_{proto}_{signal}'
  clock_reset_ports: one per domain
  package: axil_adapters_pkg
  file_header: header.txt
  extra_inputs: []
  adapter_placement: with fabric
  adapter_naming: '{from}_{type}_2_{to}'
  subwrapper_port_naming: '{instance}_{proto}_{signal}'
  ports:
    - port: aon
      exposed: true
      prefix: null
    - port: buf
      exposed: true
      prefix: null
    - port: cpu
      exposed: true
      prefix: null
    - port: dsp
      exposed: true
      prefix: null
    - port: mem
      exposed: true
      prefix: null
provenance:
  bag_version: 0.0.1
  source: axil_adapters.xlsx
  sha256: 2321ed2e5448315fdd3ea9b6ca2f33fb647861dfb8edd9f3cf40cbf1ddfc82d4
