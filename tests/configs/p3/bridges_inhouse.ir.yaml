schema: '0.3'
project:
  name: bridges_inhouse
  revision: p3
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/bridges_inhouse
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: ahb
    protocol: AHB-Lite
    topology: single-layer
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_ahb_lite_bus
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: br_ahb
        priority: null
      - index: 1
        port: dma
        priority: null
      - index: 2
        port: br_jtag
        priority: null
    slave_ports:
      - index: 0
        port: sram
        priority: null
      - index: 1
        port: br_cfg
        priority: null
      - index: 2
        port: br_mid
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: sram
        region: mem
        base: '0x4000_0000'
        end: '0x4000_FFFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: br_cfg
        region: win
        base: '0x4010_0000'
        end: '0x4010_FFFF'
        access: RW
        secure: false
      - slave_port: 2
        slave: br_mid
        region: win
        base: '0x4020_0000'
        end: '0x402F_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_ahb
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
      - master: br_jtag
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
      - master: dma
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
  - name: cfg
    protocol: AXI4-Lite
    topology: crossbar
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: NO_LATENCY
    max_mst_trans: 2
    max_slv_trans: 2
    midpoint: null
    template: bag_axil_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: br_cfg
        priority: null
    slave_ports:
      - index: 0
        port: pmu
        priority: null
      - index: 1
        port: br_lp
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: pmu
        region: regs
        base: '0x4010_0000'
        end: '0x4010_0FFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: br_lp
        region: win
        base: '0x4010_8000'
        end: '0x4010_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_cfg
        miss: DECERR
        default_slave: null
        aliases: []
  - name: dbg_apb
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: dbg
        priority: null
    slave_ports:
      - index: 0
        port: br_dbg
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: br_dbg
        region: win
        base: '0x4000_0000'
        end: '0x403F_FFFF'
        access: RW
        secure: false
      - slave_port: 0
        slave: br_dbg
        region: mem
        base: '0x8000_0000'
        end: '0x800F_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: dbg
        miss: PSLVERR
        default_slave: null
        aliases: []
  - name: jtag_apb
    protocol: APB3
    topology: decoder-mux
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: jtag
        priority: null
    slave_ports:
      - index: 0
        port: br_jtag
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: br_jtag
        region: win
        base: '0x4000_0000'
        end: '0x403F_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: jtag
        miss: PSLVERR
        default_slave: null
        aliases: []
  - name: lp
    protocol: AHB-Lite
    topology: single-layer
    data_width: 32
    addr_width: 24
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_ahb_lite_bus
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: br_lp
        priority: null
    slave_ports:
      - index: 0
        port: tmr
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: tmr
        region: regs
        base: '0x4010_9000'
        end: '0x4010_9FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_lp
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
  - name: mid
    protocol: AXI4
    topology: crossbar
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: CUT_ALL_AX
    max_mst_trans: 2
    max_slv_trans: 2
    midpoint: null
    template: bag_axi_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: br_mid
        priority: null
    slave_ports:
      - index: 0
        port: buf
        priority: null
      - index: 1
        port: br_tail
        priority: null
    id_width:
      master_side: 1
      slave_side: 1
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: buf
        region: mem
        base: '0x4020_0000'
        end: '0x4020_0FFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: br_tail
        region: win
        base: '0x4028_0000'
        end: '0x4028_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_mid
        miss: DECERR
        default_slave: null
        aliases: []
  - name: tail
    protocol: AHB-Lite
    topology: single-layer
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_ahb_lite_bus
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: br_tail
        priority: null
    slave_ports:
      - index: 0
        port: spi
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: spi
        region: regs
        base: '0x4028_0000'
        end: '0x4028_0FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_tail
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
  - name: xbar
    protocol: AXI4
    topology: crossbar
    data_width: 64
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: CUT_ALL_AX
    max_mst_trans: 4
    max_slv_trans: 4
    midpoint: null
    template: bag_axi_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: cpu
        priority: null
      - index: 1
        port: br_dbg
        priority: null
    slave_ports:
      - index: 0
        port: ram
        priority: null
      - index: 1
        port: br_ahb
        priority: null
    id_width:
      master_side: 4
      slave_side: 5
    max_parallel: 2
    addr_rules:
      - slave_port: 1
        slave: br_ahb
        region: win
        base: '0x4000_0000'
        end: '0x403F_FFFF'
        access: RW
        secure: false
      - slave_port: 0
        slave: ram
        region: mem
        base: '0x8000_0000'
        end: '0x800F_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_dbg
        miss: SLVERR
        default_slave: null
        aliases: []
      - master: cpu
        miss: DECERR
        default_slave: null
        aliases: []
masters:
  - name: cpu
    protocol: AXI4
    fabric: xbar
    data_width: 64
    addr_width: 32
    id_width: 4
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: dbg
    protocol: APB4
    fabric: dbg_apb
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: dma
    protocol: AHB-Lite
    fabric: ahb
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: jtag
    protocol: APB3
    fabric: jtag_apb
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: buf
    protocol: AXI4
    fabric: mid
    data_width: 32
    addr_width: 16
    id_width: 1
    id_width_auto: true
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: pmu
    protocol: AXI4-Lite
    fabric: cfg
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: ram
    protocol: AXI4
    fabric: xbar
    data_width: 64
    addr_width: 32
    id_width: 5
    id_width_auto: true
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: spi
    protocol: AHB-Lite
    fabric: tail
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: HRESP_ERROR
    wait_states: 0
  - name: sram
    protocol: AHB-Lite
    fabric: ahb
    data_width: 32
    addr_width: 16
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: HRESP_ERROR
    wait_states: 0
  - name: tmr
    protocol: AHB-Lite
    fabric: lp
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: HRESP_ERROR
    wait_states: 0
bridges:
  - name: br_ahb
    template: bag_axi2ahb
    upstream: xbar
    downstream: ahb
    window_base: '0x4000_0000'
    pass_through: true
    fifo_depth: 2
    upstream_protocol: AXI4
    downstream_protocol: AHB-Lite
    upstream_width: 64
    downstream_width: 32
    cdc: false
  - name: br_cfg
    template: bag_ahb2axi
    upstream: ahb
    downstream: cfg
    window_base: '0x4010_0000'
    pass_through: false
    fifo_depth: 0
    upstream_protocol: AHB-Lite
    downstream_protocol: AXI4-Lite
    upstream_width: 32
    downstream_width: 32
    cdc: false
  - name: br_dbg
    template: bag_apb2axi
    upstream: dbg_apb
    downstream: xbar
    window_base: '0x4000_0000'
    pass_through: true
    fifo_depth: 0
    upstream_protocol: APB4
    downstream_protocol: AXI4
    upstream_width: 32
    downstream_width: 64
    cdc: false
  - name: br_jtag
    template: bag_apb2ahb
    upstream: jtag_apb
    downstream: ahb
    window_base: '0x4000_0000'
    pass_through: true
    fifo_depth: 0
    upstream_protocol: APB3
    downstream_protocol: AHB-Lite
    upstream_width: 32
    downstream_width: 32
    cdc: false
  - name: br_lp
    template: bag_axi2ahb
    upstream: cfg
    downstream: lp
    window_base: '0x4010_8000'
    pass_through: true
    fifo_depth: 0
    upstream_protocol: AXI4-Lite
    downstream_protocol: AHB-Lite
    upstream_width: 32
    downstream_width: 32
    cdc: false
  - name: br_mid
    template: bag_ahb2axi
    upstream: ahb
    downstream: mid
    window_base: '0x4020_0000'
    pass_through: true
    fifo_depth: 0
    upstream_protocol: AHB-Lite
    downstream_protocol: AXI4
    upstream_width: 32
    downstream_width: 32
    cdc: false
  - name: br_tail
    template: bag_axi2ahb
    upstream: mid
    downstream: tail
    window_base: '0x4028_0000'
    pass_through: true
    fifo_depth: 0
    upstream_protocol: AXI4
    downstream_protocol: AHB-Lite
    upstream_width: 32
    downstream_width: 32
    cdc: false
adapters: []
