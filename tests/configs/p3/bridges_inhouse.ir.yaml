      wrapper: bridges_inhouse_top
      rtl_name: u_tail
    - instance: xbar
      kind: fabric
      wrapper: bridges_inhouse_top
      rtl_name: u_xbar
wrapper:
  top: bridges_inhouse_top
  port_style: flat
  signal_pattern: '{port}_{proto}_{signal}'
  clock_reset_ports: one per domain
  package: bridges_inhouse_pkg
  file_header: header.txt
  extra_inputs: []
  adapter_placement: with fabric
  adapter_naming: '{from}_{type}_2_{to}'
  subwrapper_port_naming: '{instance}_{proto}_{signal}'
  ports:
    - port: br_ahb
      exposed: false
      prefix: null
    - port: br_cfg
      exposed: false
      prefix: null
    - port: br_dbg
      exposed: false
      prefix: null
    - port: br_jtag
      exposed: false
      prefix: null
    - port: br_lp
      exposed: false
      prefix: null
    - port: br_mid
      exposed: false
      prefix: null
