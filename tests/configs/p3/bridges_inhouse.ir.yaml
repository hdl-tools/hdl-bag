hierarchy:
  top: bridges_inhouse_top
  wrappers: []
  placement:
    - instance: ahb
      kind: fabric
      wrapper: bridges_inhouse_top
      rtl_name: u_ahb
    - instance: br_ahb
      kind: bridge
      wrapper: bridges_inhouse_top
      rtl_name: u_br_ahb
    - instance: br_cfg
      kind: bridge
      wrapper: bridges_inhouse_top
      rtl_name: u_br_cfg
    - instance: br_dbg
      kind: bridge
      wrapper: bridges_inhouse_top
      rtl_name: u_br_dbg
    - instance: br_jtag
      kind: bridge
      wrapper: bridges_inhouse_top
      rtl_name: u_br_jtag
    - instance: br_lp
      kind: bridge
      wrapper: bridges_inhouse_top
      rtl_name: u_br_lp
    - instance: br_mid
      kind: bridge
      wrapper: bridges_inhouse_top
      rtl_name: u_br_mid
    - instance: br_tail
      kind: bridge
      wrapper: bridges_inhouse_top
      rtl_name: u_br_tail
    - instance: cfg
      kind: fabric
      wrapper: bridges_inhouse_top
      rtl_name: u_cfg
    - instance: dbg_apb
      kind: fabric
      wrapper: bridges_inhouse_top
      rtl_name: u_dbg_apb
    - instance: jtag_apb
      kind: fabric
      wrapper: bridges_inhouse_top
      rtl_name: u_jtag_apb
    - instance: lp
