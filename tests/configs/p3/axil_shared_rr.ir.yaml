    topology: shared-bus
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: null
    max_mst_trans: 2
    max_slv_trans: 2
    midpoint:
      fifo_depth: 0
      slice: cut
    template: bag_axil_shared_bus
    backing_ip: PULP
    master_ports:
      - index: 0
        port: m0
        priority: null
      - index: 1
        port: m1
        priority: null
      - index: 2
        port: m2
        priority: null
    slave_ports:
      - index: 0
        port: s0
        priority: null
      - index: 1
        port: s1
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: s0
        region: regs
        base: '0x1000_0000'
        end: '0x1000_3FFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: s1
        region: regs
        base: '0x1001_0000'
        end: '0x1001_3FFF'
        access: RO
        secure: false
    access_rules: []
