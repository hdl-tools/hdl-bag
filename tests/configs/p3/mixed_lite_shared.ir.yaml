    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: mcu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: pmu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: sram
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: uart
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
user_ports: []
memory_map:
  - slave: br_per
    region: win
    base: '0x4000_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: cfg
  - slave: uart
    region: regs
    base: '0x4000_0000'
