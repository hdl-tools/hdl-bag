schema: '0.4'
project:
  name: mixed_lite_shared
  revision: p3
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/mixed_lite_shared
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: ahb
    protocol: AHB-Lite
    topology: single-layer
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_ahb_lite_bus
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: br_ahb
        priority: null
    slave_ports:
      - index: 0
        port: sram
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: sram
        region: mem
        base: '0x5000_0000'
        end: '0x5000_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_ahb
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
  - name: cfg
    protocol: AXI4-Lite
    topology: crossbar
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: NO_LATENCY
    max_mst_trans: 2
    max_slv_trans: 2
    midpoint: null
    template: bag_axil_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: mcu
        priority: null
      - index: 1
        port: dbg
        priority: null
    slave_ports:
      - index: 0
        port: pmu
        priority: null
      - index: 1
        port: br_per
        priority: null
      - index: 2
        port: br_ahb
        priority: null
    id_width: null
    max_parallel: 2
    addr_rules:
      - slave_port: 1
        slave: br_per
        region: win
        base: '0x4000_0000'
        end: '0x4000_FFFF'
        access: RW
        secure: false
      - slave_port: 2
        slave: br_ahb
        region: win
        base: '0x5000_0000'
        end: '0x5000_FFFF'
        access: RW
        secure: false
      - slave_port: 0
        slave: pmu
        region: regs
        base: '0x6000_0000'
        end: '0x6000_0FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: dbg
        miss: SLVERR
        default_slave: null
        aliases: []
      - master: mcu
        miss: DECERR
        default_slave: null
        aliases: []
  - name: per
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: br_per
        priority: null
    slave_ports:
      - index: 0
        port: uart
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: uart
        region: regs
        base: '0x4000_0000'
        end: '0x4000_0FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_per
        miss: PSLVERR
        default_slave: null
        aliases: []
masters:
  - name: dbg
    protocol: AXI4
    fabric: cfg
    data_width: 32
    addr_width: 32
    id_width: 2
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: mcu
    protocol: AXI4-Lite
    fabric: cfg
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: pmu
    protocol: AXI4-Lite
    fabric: cfg
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: sram
    protocol: AHB-Lite
    fabric: ahb
    data_width: 32
    addr_width: 16
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: HRESP_ERROR
    wait_states: 0
  - name: uart
    protocol: APB4
    fabric: per
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: PSLVERR
    wait_states: 0
bridges:
  - name: br_ahb
    template: bag_axi2ahb
    upstream: cfg
    downstream: ahb
    window_base: '0x5000_0000'
    pass_through: true
    fifo_depth: 2
    upstream_protocol: AXI4-Lite
    downstream_protocol: AHB-Lite
    upstream_width: 32
    downstream_width: 32
    cdc: false
  - name: br_per
    template: bag_axi2apb
    upstream: cfg
    downstream: per
    window_base: '0x4000_0000'
    pass_through: false
    fifo_depth: 0
    upstream_protocol: AXI4-Lite
    downstream_protocol: APB4
    upstream_width: 32
    downstream_width: 32
    cdc: false
adapters:
  - name: dbg_pc_2_cfg
    type: pc
    port: dbg
    fabric: cfg
    chain_index: 0
    template: bag_pc
    params:
      from: AXI4
      to: AXI4-Lite
    placed_in: mixed_lite_shared_top
    rtl_name: u_dbg_pc_2_cfg
port_options:
