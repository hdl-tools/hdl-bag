schema: '0.4'
project:
  name: mixed_cdc_chain
  revision: p3
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/mixed_cdc_chain
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_a
    mhz: 100
    source: top port
    domain: D_A
    reset: rst_a_n
  - name: clk_b
    mhz: 100
    source: top port
    domain: D_B
    reset: rst_b_n
  - name: clk_c
    mhz: 100
    source: top port
    domain: D_C
    reset: rst_c_n
  - name: clk_d
    mhz: 100
    source: top port
    domain: D_D
    reset: rst_d_n
resets:
  - name: rst_a_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_A
  - name: rst_b_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_B
  - name: rst_c_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_C
  - name: rst_d_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_D
fabrics:
  - name: lite
    protocol: AXI4-Lite
    topology: crossbar
    data_width: 32
    addr_width: 32
    domain: D_B
    arbitration: round-robin
    latency_mode: NO_LATENCY
    max_mst_trans: 2
    max_slv_trans: 2
    midpoint: null
    template: bag_axil_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: br_lite
        priority: null
    slave_ports:
      - index: 0
        port: pmu
        priority: null
      - index: 1
        port: br_per
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: pmu
        region: regs
        base: '0x4000_0000'
        end: '0x4000_0FFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: br_per
        region: win
        base: '0x4010_0000'
        end: '0x4010_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_lite
        miss: SLVERR
        default_slave: null
        aliases: []
  - name: per
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 32
    domain: D_C
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: br_per
        priority: null
    slave_ports:
      - index: 0
        port: uart
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: uart
        region: regs
        base: '0x4010_0000'
        end: '0x4010_0FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_per
        miss: PSLVERR
        default_slave: null
        aliases: []
  - name: xbar
    protocol: AXI4
    topology: crossbar
    data_width: 32
    addr_width: 32
    domain: D_A
    arbitration: round-robin
    latency_mode: CUT_ALL_AX
    max_mst_trans: 4
    max_slv_trans: 4
    midpoint: null
    template: bag_axi_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: cpu
        priority: null
    slave_ports:
      - index: 0
        port: ram
        priority: null
      - index: 1
        port: far
        priority: null
      - index: 2
        port: br_lite
        priority: null
    id_width:
      master_side: 3
      slave_side: 3
    max_parallel: 1
    addr_rules:
      - slave_port: 2
        slave: br_lite
        region: win
        base: '0x4000_0000'
        end: '0x401F_FFFF'
        access: RW
        secure: false
      - slave_port: 0
        slave: ram
        region: mem
        base: '0x8000_0000'
        end: '0x800F_FFFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: far
        region: mem
        base: '0x9000_0000'
        end: '0x900F_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: cpu
        miss: DECERR
        default_slave: null
        aliases: []
masters:
  - name: cpu
    protocol: AXI4
    fabric: xbar
    data_width: 32
    addr_width: 32
    id_width: 3
    user_width: 0
    domain: D_A
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: far
    protocol: AXI4
    fabric: xbar
    data_width: 32
    addr_width: 20
    id_width: 3
    id_width_auto: true
    user_width: 0
    domain: D_D
    error_response: SLVERR
    wait_states: 0
  - name: pmu
    protocol: AXI4-Lite
    fabric: lite
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_B
    error_response: SLVERR
    wait_states: 0
  - name: ram
    protocol: AXI4
    fabric: xbar
    data_width: 32
    addr_width: 32
    id_width: 3
    id_width_auto: true
    user_width: 0
    domain: D_A
    error_response: SLVERR
    wait_states: 0
  - name: uart
    protocol: APB4
    fabric: per
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_C
    error_response: PSLVERR
    wait_states: 0
bridges:
  - name: br_lite
    template: bag_axi2axil
    upstream: xbar
    downstream: lite
    window_base: '0x4000_0000'
    pass_through: false
    fifo_depth: 0
    upstream_protocol: AXI4
    downstream_protocol: AXI4-Lite
    upstream_width: 32
    downstream_width: 32
    cdc: true
  - name: br_per
    template: bag_axi2apb
    upstream: lite
    downstream: per
    window_base: '0x4010_0000'
    pass_through: false
    fifo_depth: 0
    upstream_protocol: AXI4-Lite
    downstream_protocol: APB4
    upstream_width: 32
    downstream_width: 32
    cdc: true
adapters:
  - name: xbar_cdc_2_far
    type: cdc
    port: far
    fabric: xbar
    chain_index: 0
    template: bag_cdc
    params:
      from: D_A
      to: D_D
    placed_in: mixed_cdc_chain_top
    rtl_name: u_xbar_cdc_2_far
port_options:
  - port: br_lite
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: br_per
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
  - port: cpu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: far
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: pmu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: ram
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: uart
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
user_ports: []
memory_map:
  - slave: pmu
    region: regs
    base: '0x4000_0000'
    size: '0x0000_1000'
    access: RW
    secure: false
    fabric: lite
  - slave: br_lite
    region: win
    base: '0x4000_0000'
    size: '0x0020_0000'
    access: RW
    secure: false
    fabric: xbar
  - slave: br_per
    region: win
    base: '0x4010_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: lite
  - slave: uart
    region: regs
    base: '0x4010_0000'
    size: '0x0000_1000'
    access: RW
    secure: false
    fabric: per
  - slave: ram
    region: mem
    base: '0x8000_0000'
    size: '0x0010_0000'
    access: RW
    secure: false
    fabric: xbar
  - slave: far
    region: mem
    base: '0x9000_0000'
    size: '0x0010_0000'
    access: RW
    secure: false
    fabric: xbar
hierarchy:
  top: mixed_cdc_chain_top
  wrappers: []
  placement:
    - instance: br_lite
      kind: bridge
      wrapper: mixed_cdc_chain_top
      rtl_name: u_br_lite
    - instance: br_per
      kind: bridge
      wrapper: mixed_cdc_chain_top
      rtl_name: u_br_per
    - instance: lite
      kind: fabric
      wrapper: mixed_cdc_chain_top
      rtl_name: u_lite
    - instance: per
      kind: fabric
      wrapper: mixed_cdc_chain_top
      rtl_name: u_per
    - instance: xbar
      kind: fabric
      wrapper: mixed_cdc_chain_top
      rtl_name: u_xbar
    - instance: xbar_cdc_2_far
      kind: adapter
      wrapper: mixed_cdc_chain_top
      rtl_name: u_xbar_cdc_2_far
wrapper:
  top: mixed_cdc_chain_top
  port_style: flat
  signal_pattern: '{port}_{proto}_{signal}'
  clock_reset_ports: one per domain
  package: mixed_cdc_chain_pkg
  file_header: header.txt
  extra_inputs: []
  adapter_placement: with fabric
  adapter_naming: '{from}_{type}_2_{to}'
  subwrapper_port_naming: '{instance}_{proto}_{signal}'
  ports:
    - port: br_lite
      exposed: false
      prefix: null
    - port: br_per
      exposed: false
      prefix: null
    - port: cpu
      exposed: true
      prefix: null
    - port: far
      exposed: true
      prefix: null
    - port: pmu
      exposed: true
      prefix: null
    - port: ram
      exposed: true
      prefix: null
    - port: uart
      exposed: true
      prefix: null
provenance:
  bag_version: 0.0.1
  source: mixed_cdc_chain.xlsx
  sha256: 51317ca9cefc7f37de71cc5cfcc33deef6957d0923bcdbf63e33e1893d3d8540
