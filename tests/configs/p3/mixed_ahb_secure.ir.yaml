schema: '0.4'
project:
  name: mixed_ahb_secure
  revision: p3
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/mixed_ahb_secure
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: ahb
    protocol: AHB-Lite
    topology: single-layer
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_ahb_lite_bus
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: mcu
        priority: null
      - index: 1
        port: dsp
        priority: null
    slave_ports:
      - index: 0
        port: tcm
        priority: null
      - index: 1
        port: br_axi
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: tcm
        region: mem
        base: '0x0010_0000'
        end: '0x0010_FFFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: br_axi
        region: win
        base: '0x8000_0000'
        end: '0x81FF_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: dsp
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
      - master: mcu
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
  - name: xbar
    protocol: AXI4
    topology: crossbar
    data_width: 64
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: CUT_ALL_AX
    max_mst_trans: 4
    max_slv_trans: 4
    midpoint: null
    template: bag_axi_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: cpu
        priority: null
      - index: 1
        port: br_axi
        priority: null
    slave_ports:
      - index: 0
        port: ram
        priority: null
      - index: 1
        port: rom
        priority: null
    id_width:
      master_side: 3
      slave_side: 4
    max_parallel: 2
    addr_rules:
      - slave_port: 0
        slave: ram
        region: mem
        base: '0x8000_0000'
        end: '0x800F_FFFF'
        access: RW
        secure: false
      - slave_port: 0
        slave: ram
        region: sec
        base: '0x8010_0000'
        end: '0x8010_FFFF'
        access: RW
        secure: true
      - slave_port: 1
        slave: rom
        region: code
        base: '0x8100_0000'
        end: '0x8100_FFFF'
        access: RO
        secure: false
    access_rules:
      - master: cpu
        slave: ram
        access: RO
    decode:
      - master: br_axi
        miss: SLVERR
        default_slave: null
        aliases: []
      - master: cpu
        miss: DECERR
        default_slave: null
        aliases:
          - base: '0x0000_0000'
            size: '0x0001_0000'
            to: '0x8100_0000'
            enable: remap_i
masters:
  - name: cpu
    protocol: AXI4
    fabric: xbar
    data_width: 64
    addr_width: 32
    id_width: 3
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: dsp
    protocol: AHB-Lite
    fabric: ahb
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: mcu
    protocol: AHB-Lite
    fabric: ahb
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: ram
    protocol: AXI4
    fabric: xbar
    data_width: 64
    addr_width: 32
    id_width: 4
    id_width_auto: true
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: rom
    protocol: AXI4
    fabric: xbar
    data_width: 64
    addr_width: 20
    id_width: 4
    id_width_auto: true
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: tcm
    protocol: AHB-Lite
    fabric: ahb
    data_width: 32
    addr_width: 16
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: HRESP_ERROR
    wait_states: 0
bridges:
  - name: br_axi
    template: bag_ahb2axi
    upstream: ahb
    downstream: xbar
    window_base: '0x8000_0000'
    pass_through: true
    fifo_depth: 0
    upstream_protocol: AHB-Lite
    downstream_protocol: AXI4
    upstream_width: 32
    downstream_width: 64
    cdc: false
adapters: []
port_options:
  - port: br_axi
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: cpu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: dsp
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: mcu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: ram
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: rom
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: tcm
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
user_ports: []
memory_map:
  - slave: tcm
    region: mem
    base: '0x0010_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: ahb
  - slave: br_axi
    region: win
    base: '0x8000_0000'
    size: '0x0200_0000'
    access: RW
    secure: false
    fabric: ahb
  - slave: ram
    region: mem
    base: '0x8000_0000'
    size: '0x0010_0000'
    access: RW
    secure: false
    fabric: xbar
  - slave: ram
    region: sec
    base: '0x8010_0000'
    size: '0x0001_0000'
    access: RW
    secure: true
    fabric: xbar
  - slave: rom
    region: code
    base: '0x8100_0000'
    size: '0x0001_0000'
    access: RO
    secure: false
    fabric: xbar
hierarchy:
  top: mixed_ahb_secure_top
  wrappers: []
  placement:
    - instance: ahb
      kind: fabric
      wrapper: mixed_ahb_secure_top
      rtl_name: u_ahb
    - instance: br_axi
      kind: bridge
      wrapper: mixed_ahb_secure_top
      rtl_name: u_br_axi
    - instance: xbar
      kind: fabric
      wrapper: mixed_ahb_secure_top
      rtl_name: u_xbar
wrapper:
  top: mixed_ahb_secure_top
  port_style: flat
  signal_pattern: '{port}_{proto}_{signal}'
  clock_reset_ports: one per domain
  package: mixed_ahb_secure_pkg
  file_header: header.txt
  extra_inputs:
    - remap_i
  adapter_placement: with fabric
  adapter_naming: '{from}_{type}_2_{to}'
  subwrapper_port_naming: '{instance}_{proto}_{signal}'
  ports:
    - port: br_axi
      exposed: false
      prefix: null
    - port: cpu
      exposed: true
      prefix: null
    - port: dsp
      exposed: true
      prefix: null
    - port: mcu
      exposed: true
      prefix: null
    - port: ram
      exposed: true
      prefix: null
    - port: rom
      exposed: true
      prefix: null
    - port: tcm
      exposed: true
      prefix: null
provenance:
  bag_version: 0.0.1
  source: mixed_ahb_secure.xlsx
  sha256: 81aaa696d0be21c0bc154484643555e2c147799b461b1bba86ee2837b44485f5
