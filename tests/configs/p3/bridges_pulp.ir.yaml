schema: '0.3'
project:
  name: bridges_pulp
  revision: p3
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/bridges_pulp
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_per
    mhz: 100
    source: top port
    domain: D_PER
    reset: rst_per_n
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_per_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_PER
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: cfg
    protocol: AXI4-Lite
    topology: crossbar
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: NO_LATENCY
    max_mst_trans: 2
    max_slv_trans: 2
    midpoint: null
    template: bag_axil_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: br_cfg
        priority: null
      - index: 1
        port: aux
        priority: null
    slave_ports:
      - index: 0
        port: pmu
        priority: null
      - index: 1
        port: br_lp
        priority: null
    id_width: null
    max_parallel: 2
    addr_rules:
      - slave_port: 0
        slave: pmu
        region: regs
        base: '0x5000_0000'
        end: '0x5000_0FFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: br_lp
        region: win
        base: '0x5001_0000'
        end: '0x5001_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: aux
        miss: DECERR
        default_slave: null
        aliases: []
      - master: br_cfg
        miss: DECERR
        default_slave: null
        aliases: []
  - name: lp
    protocol: APB3
    topology: decoder-mux
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: br_lp
        priority: null
    slave_ports:
      - index: 0
        port: tmr
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: tmr
        region: regs
        base: '0x5001_0000'
        end: '0x5001_0FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_lp
        miss: PSLVERR
        default_slave: null
        aliases: []
  - name: per
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 32
    domain: D_PER
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: br_per
        priority: null
    slave_ports:
      - index: 0
        port: uart
        priority: null
      - index: 1
        port: gpio
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: uart
        region: regs
        base: '0x4000_0000'
        end: '0x4000_0FFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: gpio
        region: regs
        base: '0x4000_1000'
        end: '0x4000_1FFF'
        access: RO
        secure: false
    access_rules: []
    decode:
      - master: br_per
        miss: PSLVERR
        default_slave: null
        aliases: []
  - name: xbar
    protocol: AXI4
    topology: crossbar
    data_width: 64
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: CUT_ALL_AX
    max_mst_trans: 4
    max_slv_trans: 4
    midpoint: null
    template: bag_axi_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: cpu
        priority: null
      - index: 1
        port: dbg
        priority: null
    slave_ports:
      - index: 0
        port: ram
        priority: null
      - index: 1
        port: br_per
        priority: null
      - index: 2
        port: br_cfg
        priority: null
    id_width:
      master_side: 4
      slave_side: 5
    max_parallel: 2
    addr_rules:
      - slave_port: 1
        slave: br_per
        region: win
        base: '0x4000_0000'
        end: '0x4000_FFFF'
        access: RW
        secure: false
      - slave_port: 2
        slave: br_cfg
        region: win
        base: '0x5000_0000'
        end: '0x500F_FFFF'
        access: RW
        secure: false
      - slave_port: 0
        slave: ram
        region: mem
        base: '0x8000_0000'
        end: '0x800F_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: cpu
        miss: DECERR
        default_slave: null
        aliases: []
      - master: dbg
        miss: SLVERR
        default_slave: null
        aliases: []
masters:
  - name: aux
    protocol: AXI4-Lite
    fabric: cfg
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: cpu
    protocol: AXI4
    fabric: xbar
    data_width: 64
    addr_width: 32
    id_width: 4
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: dbg
    protocol: AXI4-Lite
    fabric: xbar
    data_width: 64
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: gpio
    protocol: APB4
    fabric: per
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_PER
    error_response: PSLVERR
    wait_states: 0
  - name: pmu
    protocol: AXI4-Lite
    fabric: cfg
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: ram
    protocol: AXI4
    fabric: xbar
    data_width: 64
    addr_width: 32
    id_width: 5
    id_width_auto: true
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: tmr
    protocol: APB3
    fabric: lp
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: PSLVERR
    wait_states: 0
  - name: uart
    protocol: APB4
    fabric: per
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_PER
    error_response: PSLVERR
    wait_states: 0
bridges:
  - name: br_cfg
    template: bag_axi2axil
    upstream: xbar
    downstream: cfg
    window_base: '0x5000_0000'
    pass_through: true
    fifo_depth: 2
    upstream_protocol: AXI4
    downstream_protocol: AXI4-Lite
    upstream_width: 64
    downstream_width: 32
    cdc: false
  - name: br_lp
    template: bag_axi2apb
    upstream: cfg
    downstream: lp
    window_base: '0x5001_0000'
    pass_through: true
    fifo_depth: 0
    upstream_protocol: AXI4-Lite
    downstream_protocol: APB3
    upstream_width: 32
    downstream_width: 32
    cdc: false
  - name: br_per
    template: bag_axi2apb
    upstream: xbar
    downstream: per
    window_base: '0x4000_0000'
    pass_through: false
    fifo_depth: 2
    upstream_protocol: AXI4
    downstream_protocol: APB4
    upstream_width: 64
    downstream_width: 32
    cdc: true
adapters:
  - name: dbg_pc_2_xbar
    type: pc
    port: dbg
    fabric: xbar
    chain_index: 0
    template: bag_pc
    params:
      from: AXI4-Lite
      to: AXI4
    placed_in: bridges_pulp_top
    rtl_name: u_dbg_pc_2_xbar
