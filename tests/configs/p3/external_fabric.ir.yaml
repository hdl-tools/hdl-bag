schema: '0.6'
project:
  name: external_fabric
  revision: p3
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/external_fabric
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_noc
    mhz: 100
    source: top port
    domain: D_NOC
    reset: rst_noc_n
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_noc_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_NOC
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: noc
    protocol: AXI4
    topology: crossbar
    data_width: 32
    addr_width: 32
    domain: D_NOC
    arbitration: round-robin
    latency_mode: CUT_ALL_AX
    max_mst_trans: 4
    max_slv_trans: 4
    midpoint: null
    template: bag_external
    backing_ip: user RTL
    external_module: null
    master_ports:
      - index: 0
        port: cpu
        priority: null
    slave_ports:
      - index: 0
        port: ram
        priority: null
    id_width:
      master_side: 4
      slave_side: 4
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: ram
        region: mem
        base: '0x8000_0000'
        end: '0x800F_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: cpu
        miss: DECERR
        default_slave: null
        aliases: []
  - name: peri
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 16
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_external
    backing_ip: user RTL
    external_module: null
    master_ports:
      - index: 0
        port: br_peri
        priority: null
    slave_ports:
      - index: 0
        port: uart
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: uart
        region: regs
        base: '0x5000_0000'
        end: '0x5000_0FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_peri
        miss: PSLVERR
        default_slave: null
        aliases: []
  - name: sys
    protocol: AHB-Lite
    topology: single-layer
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_ahb_lite_bus
    backing_ip: in-house template
    external_module: null
    master_ports:
      - index: 0
        port: mcu
        priority: null
    slave_ports:
      - index: 0
        port: br_peri
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: br_peri
        region: win
        base: '0x5000_0000'
        end: '0x5000_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: mcu
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
masters:
  - name: cpu
    protocol: AXI4
    fabric: noc
    data_width: 64
    addr_width: 32
    id_width: 4
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: mcu
    protocol: AHB-Lite
    fabric: sys
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: ram
    protocol: AXI4
    fabric: noc
    data_width: 32
    addr_width: 32
    id_width: 4
    id_width_auto: true
    user_width: 0
    domain: D_NOC
    error_response: SLVERR
    wait_states: 0
  - name: uart
    protocol: APB4
    fabric: peri
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: PSLVERR
    wait_states: 0
bridges:
  - name: br_peri
    template: bag_ahb2apb
    upstream: sys
    downstream: peri
    window_base: '0x5000_0000'
    pass_through: false
    fifo_depth: 0
    upstream_protocol: AHB-Lite
    downstream_protocol: APB4
    upstream_width: 32
    downstream_width: 32
    cdc: false
adapters:
  - name: cpu_cdc_2_noc
    type: cdc
    port: cpu
    fabric: noc
    chain_index: 0
    template: bag_cdc
    params:
      from: D_SYS
      to: D_NOC
    placed_in: ss_noc
    rtl_name: u_cpu_cdc_2_noc
  - name: cpu_dw_2_noc
    type: dw
    port: cpu
    fabric: noc
    chain_index: 1
    template: bag_dw
    params:
      from: 64
      to: 32
    placed_in: ss_noc
    rtl_name: u_cpu_dw_2_noc
port_options:
  - port: br_peri
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
  - port: cpu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: mcu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: ram
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: uart
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
user_ports:
  - instance: noc
    port: cfg_i
    direction: input
    width: 4
    connection: expose
    target: null
    tie: null
  - instance: noc
    port: cfg_o
    direction: output
    width: 4
    connection: expose
    target: null
    tie: null
  - instance: noc
    port: clk_cfg_i
    direction: input
    width: 1
    connection: clock
    target: D_SYS
    tie: null
  - instance: noc
    port: err_o
    direction: output
    width: 2
    connection: open
    target: null
    tie: null
  - instance: noc
    port: irq_o
    direction: output
    width: 1
    connection: expose
    target: null
    tie: null
  - instance: noc
    port: lock_i
    direction: input
    width: 1
    connection: tie
    target: null
    tie: '0x0000_0001'
  - instance: noc
    port: qos_i
    direction: input
    width: 4
    connection: tie
    target: null
    tie: '0x0000_000A'
  - instance: noc
    port: qos_o
    direction: output
    width: 4
    connection: expose
    target: null
    tie: null
  - instance: noc
    port: rst_cfg_ni
    direction: input
    width: 1
    connection: reset
    target: D_SYS
    tie: null
  - instance: noc
    port: test_i
    direction: input
    width: 1
    connection: extra-input
    target: test_mode_i
    tie: null
  - instance: peri
    port: irq_o
    direction: output
    width: 1
    connection: expose
    target: null
    tie: null
memory_map:
  - slave: uart
    region: regs
    base: '0x5000_0000'
    size: '0x0000_1000'
    access: RW
    secure: false
    fabric: peri
  - slave: br_peri
    region: win
    base: '0x5000_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: sys
  - slave: ram
    region: mem
    base: '0x8000_0000'
    size: '0x0010_0000'
    access: RW
    secure: false
    fabric: noc
hierarchy:
  top: external_fabric_top
  wrappers:
    - name: ss_noc
      parent: external_fabric_top
  placement:
    - instance: br_peri
      kind: bridge
      wrapper: external_fabric_top
      rtl_name: u_br_peri
    - instance: cpu_cdc_2_noc
      kind: adapter
      wrapper: ss_noc
      rtl_name: u_cpu_cdc_2_noc
    - instance: cpu_dw_2_noc
      kind: adapter
      wrapper: ss_noc
      rtl_name: u_cpu_dw_2_noc
    - instance: noc
      kind: fabric
      wrapper: ss_noc
      rtl_name: u_noc
    - instance: peri
      kind: fabric
      wrapper: external_fabric_top
      rtl_name: u_peri
    - instance: sys
      kind: fabric
      wrapper: external_fabric_top
      rtl_name: u_sys
wrapper:
  top: external_fabric_top
  port_style: flat
  signal_pattern: '{port}_{proto}_{signal}'
  clock_reset_ports: one per domain
  package: external_fabric_pkg
  file_header: header.txt
  extra_inputs:
    - test_mode_i
  adapter_placement: with fabric
  adapter_naming: '{from}_{type}_2_{to}'
  subwrapper_port_naming: '{instance}_{proto}_{signal}'
  ports:
    - port: br_peri
      exposed: false
      prefix: null
    - port: cpu
      exposed: true
      prefix: null
    - port: mcu
      exposed: true
      prefix: null
    - port: ram
      exposed: true
      prefix: null
    - port: uart
      exposed: true
      prefix: null
provenance:
  bag_version: 0.0.1
  source: external_fabric.xlsx
  sha256: 4f41916499ef9ea3ede7da897c42ad23e78d9e913f7715955d97e66e435e9faa
