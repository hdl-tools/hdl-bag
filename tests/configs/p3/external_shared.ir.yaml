schema: '0.6'
project:
  name: external_shared
  revision: p3
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/external_shared
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: noc
    protocol: AXI4
    topology: crossbar
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: NO_LATENCY
    max_mst_trans: 4
    max_slv_trans: 4
    midpoint: null
    template: bag_external
    backing_ip: user RTL
    external_module: my_noc
    master_ports:
      - index: 0
        port: cpu
        priority: null
    slave_ports:
      - index: 0
        port: ram
        priority: null
    id_width:
      master_side: 2
      slave_side: 2
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: ram
        region: mem
        base: '0x8000_0000'
        end: '0x800F_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: cpu
        miss: DECERR
        default_slave: null
        aliases: []
  - name: per_a
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 16
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_external
    backing_ip: user RTL
    external_module: shared_apb
    master_ports:
      - index: 0
        port: br_a
        priority: null
    slave_ports:
      - index: 0
        port: uart_a
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: uart_a
        region: regs
        base: '0x5000_0000'
        end: '0x5000_0FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_a
        miss: PSLVERR
        default_slave: null
        aliases: []
  - name: per_b
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 16
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_external
    backing_ip: user RTL
    external_module: shared_apb
    master_ports:
      - index: 0
        port: br_b
        priority: null
    slave_ports:
      - index: 0
        port: uart_b
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: uart_b
        region: regs
        base: '0x5010_0000'
        end: '0x5010_0FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_b
        miss: PSLVERR
        default_slave: null
        aliases: []
  - name: sys
    protocol: AHB-Lite
    topology: single-layer
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_ahb_lite_bus
    backing_ip: in-house template
    external_module: null
    master_ports:
      - index: 0
        port: mcu
        priority: null
    slave_ports:
      - index: 0
        port: br_a
        priority: null
      - index: 1
        port: br_b
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: br_a
        region: win
        base: '0x5000_0000'
        end: '0x5000_FFFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: br_b
        region: win
        base: '0x5010_0000'
        end: '0x5010_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: mcu
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
masters:
  - name: cpu
    protocol: AXI4
    fabric: noc
    data_width: 32
    addr_width: 32
    id_width: 2
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: mcu
    protocol: AHB-Lite
    fabric: sys
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: ram
    protocol: AXI4
    fabric: noc
    data_width: 32
    addr_width: 32
    id_width: 2
    id_width_auto: true
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: uart_a
    protocol: APB4
    fabric: per_a
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: PSLVERR
    wait_states: 0
  - name: uart_b
    protocol: APB4
    fabric: per_b
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: PSLVERR
    wait_states: 0
bridges:
  - name: br_a
    template: bag_ahb2apb
    upstream: sys
    downstream: per_a
    window_base: '0x5000_0000'
    pass_through: false
    fifo_depth: 0
    upstream_protocol: AHB-Lite
    downstream_protocol: APB4
    upstream_width: 32
    downstream_width: 32
    cdc: false
  - name: br_b
    template: bag_ahb2apb
    upstream: sys
    downstream: per_b
    window_base: '0x5010_0000'
    pass_through: false
    fifo_depth: 0
    upstream_protocol: AHB-Lite
    downstream_protocol: APB4
    upstream_width: 32
    downstream_width: 32
    cdc: false
adapters: []
port_options:
  - port: br_a
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
  - port: br_b
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
  - port: cpu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: mcu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: ram
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: uart_a
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
  - port: uart_b
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
user_ports: []
memory_map:
  - slave: uart_a
    region: regs
    base: '0x5000_0000'
    size: '0x0000_1000'
    access: RW
    secure: false
    fabric: per_a
  - slave: br_a
    region: win
    base: '0x5000_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: sys
  - slave: uart_b
    region: regs
    base: '0x5010_0000'
    size: '0x0000_1000'
    access: RW
    secure: false
    fabric: per_b
  - slave: br_b
    region: win
    base: '0x5010_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: sys
  - slave: ram
    region: mem
    base: '0x8000_0000'
    size: '0x0010_0000'
    access: RW
    secure: false
    fabric: noc
hierarchy:
  top: external_shared_top
  wrappers: []
  placement:
    - instance: br_a
      kind: bridge
      wrapper: external_shared_top
      rtl_name: u_br_a
    - instance: br_b
      kind: bridge
      wrapper: external_shared_top
      rtl_name: u_br_b
    - instance: noc
