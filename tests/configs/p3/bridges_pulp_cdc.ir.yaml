    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_aon
    mhz: 100
    source: top port
    domain: D_AON
    reset: rst_aon_n
  - name: clk_per
    mhz: 100
    source: top port
    domain: D_PER
    reset: rst_per_n
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_aon_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_AON
  - name: rst_per_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_PER
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
