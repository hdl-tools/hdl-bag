    data_width: 32
    addr_width: 40
    domain: D_SYS
    arbitration: round-robin
    latency_mode: NO_LATENCY
    max_mst_trans: 8
    max_slv_trans: 8
    midpoint: null
    template: bag_axi_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: a
        priority: null
      - index: 1
        port: b
        priority: null
    slave_ports:
      - index: 0
        port: s3
        priority: null
      - index: 1
        port: s2
        priority: null
      - index: 2
        port: s1
        priority: null
      - index: 3
        port: s0
        priority: null
    id_width:
      master_side: 3
      slave_side: 4
    max_parallel: 2
    addr_rules:
      - slave_port: 3
        slave: s0
        region: mem
        base: '0x2000_0000'
        end: '0x200F_FFFF'
        access: RW
        secure: false
      - slave_port: 2
        slave: s1
        region: mem
        base: '0x2010_0000'
        end: '0x201F_FFFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: s2
        region: mem
        base: '0x2020_0000'
        end: '0x202F_FFFF'
        access: RW
        secure: false
      - slave_port: 0
        slave: s3
        region: mem
        base: '0x2030_0000'
        end: '0x203F_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: a
        miss: DECERR
        default_slave: null
        aliases: []
      - master: b
        miss: DECERR
        default_slave: null
        aliases: []
