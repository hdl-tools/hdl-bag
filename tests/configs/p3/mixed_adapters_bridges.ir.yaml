schema: '0.6'
project:
  name: mixed_adapters_bridges
  revision: p3
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/mixed_adapters_bridges
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: ahb
    protocol: AHB-Lite
    topology: single-layer
    data_width: 32
    addr_width: 24
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_ahb_lite_bus
    backing_ip: in-house template
    external_module: null
    master_ports:
      - index: 0
        port: br_ahb
        priority: null
    slave_ports:
      - index: 0
        port: sram
        priority: null
      - index: 1
        port: br_per
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: sram
        region: mem
        base: '0x4000_0000'
        end: '0x4000_FFFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: br_per
        region: win
        base: '0x4010_0000'
        end: '0x4010_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_ahb
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
  - name: per
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 24
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    external_module: null
    master_ports:
      - index: 0
        port: br_per
        priority: null
    slave_ports:
      - index: 0
        port: uart
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: uart
        region: regs
        base: '0x4010_0000'
        end: '0x4010_0FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_per
        miss: PSLVERR
        default_slave: null
        aliases: []
  - name: xbar
    protocol: AXI4
    topology: crossbar
    data_width: 64
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: CUT_SLV_AX
    max_mst_trans: 4
    max_slv_trans: 4
    midpoint: null
    template: bag_axi_xbar
    backing_ip: PULP
    external_module: null
    master_ports:
      - index: 0
        port: cpu
        priority: null
      - index: 1
        port: dbg
        priority: null
    slave_ports:
      - index: 0
        port: ram
        priority: null
      - index: 1
        port: pmu
        priority: null
      - index: 2
        port: br_ahb
        priority: null
    id_width:
      master_side: 4
      slave_side: 5
    max_parallel: 2
    addr_rules:
      - slave_port: 2
        slave: br_ahb
        region: win
        base: '0x4000_0000'
        end: '0x401F_FFFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: pmu
        region: regs
        base: '0x6000_0000'
        end: '0x6000_0FFF'
        access: RW
        secure: false
      - slave_port: 0
        slave: ram
        region: mem
        base: '0x8000_0000'
        end: '0x800F_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: cpu
        miss: DECERR
        default_slave: null
        aliases: []
      - master: dbg
        miss: SLVERR
        default_slave: null
        aliases: []
masters:
  - name: cpu
    protocol: AXI4
    fabric: xbar
    data_width: 64
    addr_width: 32
    id_width: 4
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: dbg
    protocol: AXI4-Lite
    fabric: xbar
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: pmu
    protocol: AXI4-Lite
    fabric: xbar
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: ram
    protocol: AXI4
    fabric: xbar
    data_width: 64
    addr_width: 32
    id_width: 2
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: sram
    protocol: AHB-Lite
    fabric: ahb
    data_width: 32
    addr_width: 16
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: HRESP_ERROR
    wait_states: 0
  - name: uart
    protocol: APB4
    fabric: per
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: PSLVERR
    wait_states: 0
bridges:
  - name: br_ahb
    template: bag_axi2ahb
    upstream: xbar
    downstream: ahb
    window_base: '0x4000_0000'
    pass_through: false
    fifo_depth: 2
    upstream_protocol: AXI4
    downstream_protocol: AHB-Lite
    upstream_width: 64
    downstream_width: 32
    cdc: false
  - name: br_per
    template: bag_ahb2apb
    upstream: ahb
    downstream: per
    window_base: '0x4010_0000'
    pass_through: true
    fifo_depth: 0
    upstream_protocol: AHB-Lite
    downstream_protocol: APB4
    upstream_width: 32
    downstream_width: 32
    cdc: false
adapters:
  - name: cpu_fifo_2_xbar
    type: fifo
    port: cpu
    fabric: xbar
    chain_index: 0
    template: bag_fifo
    params:
      depth: 2
    placed_in: mixed_adapters_bridges_top
    rtl_name: u_cpu_fifo_2_xbar
  - name: cpu_cut_2_xbar
    type: cut
    port: cpu
    fabric: xbar
    chain_index: 1
    template: bag_cut
    params:
      stages: 2
    placed_in: mixed_adapters_bridges_top
    rtl_name: u_cpu_cut_2_xbar
  - name: dbg_pc_2_xbar
    type: pc
    port: dbg
    fabric: xbar
    chain_index: 0
    template: bag_pc
    params:
      from: AXI4-Lite
      to: AXI4
    placed_in: mixed_adapters_bridges_top
    rtl_name: u_dbg_pc_2_xbar
  - name: dbg_dw_2_xbar
    type: dw
    port: dbg
    fabric: xbar
    chain_index: 1
    template: bag_dw
    params:
      from: 32
      to: 64
    placed_in: mixed_adapters_bridges_top
    rtl_name: u_dbg_dw_2_xbar
  - name: xbar_pc_2_pmu
    type: pc
    port: pmu
    fabric: xbar
    chain_index: 0
    template: bag_pc
    params:
      from: AXI4
      to: AXI4-Lite
    placed_in: mixed_adapters_bridges_top
    rtl_name: u_xbar_pc_2_pmu
  - name: xbar_dw_2_pmu
    type: dw
    port: pmu
    fabric: xbar
    chain_index: 1
    template: bag_dw
    params:
      from: 64
      to: 32
    placed_in: mixed_adapters_bridges_top
    rtl_name: u_xbar_dw_2_pmu
  - name: xbar_iw_2_ram
    type: iw
    port: ram
    fabric: xbar
    chain_index: 0
    template: bag_iw
    params:
      from: 5
      to: 2
    placed_in: mixed_adapters_bridges_top
    rtl_name: u_xbar_iw_2_ram
port_options:
  - port: br_ahb
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: br_per
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
  - port: cpu
    fifo_depth: 2
    slice: multicut-2
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: dbg
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: pmu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: ram
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: sram
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: uart
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
user_ports: []
memory_map:
  - slave: sram
    region: mem
    base: '0x4000_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: ahb
  - slave: br_ahb
    region: win
    base: '0x4000_0000'
    size: '0x0020_0000'
    access: RW
    secure: false
    fabric: xbar
  - slave: br_per
    region: win
    base: '0x4010_0000'
    size: '0x0001_0000'
    access: RW
