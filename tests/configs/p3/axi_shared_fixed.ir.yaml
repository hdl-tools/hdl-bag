schema: '0.6'
project:
  name: axi_shared_fixed
  revision: p3
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/axi_shared_fixed
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: bus
    protocol: AXI4
    topology: shared-bus
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: fixed-priority
    latency_mode: null
    max_mst_trans: 2
    max_slv_trans: 2
    midpoint:
      fifo_depth: 2
      slice: multicut-3
    template: bag_axi_shared_bus
    backing_ip: PULP
    external_module: null
    master_ports:
      - index: 0
        port: m0
        priority: 2
      - index: 1
        port: m1
        priority: 1
      - index: 2
        port: m2
        priority: 0
    slave_ports:
      - index: 0
        port: s0
        priority: null
      - index: 1
        port: s1
        priority: null
      - index: 2
        port: s2
        priority: null
    id_width:
      master_side: 3
      slave_side: 5
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: s0
        region: regs
        base: '0x1000_0000'
        end: '0x1000_3FFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: s1
        region: regs
        base: '0x1001_0000'
        end: '0x1001_3FFF'
        access: RO
        secure: false
      - slave_port: 2
        slave: s2
        region: regs
        base: '0x1002_0000'
        end: '0x1002_3FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: m0
        miss: DECERR
        default_slave: null
        aliases: []
      - master: m1
        miss: SLVERR
        default_slave: null
        aliases: []
      - master: m2
        miss: DECERR
        default_slave: null
        aliases: []
masters:
  - name: m0
    protocol: AXI4
    fabric: bus
    data_width: 32
    addr_width: 32
    id_width: 1
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: m1
    protocol: AXI4
    fabric: bus
    data_width: 32
    addr_width: 32
    id_width: 2
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: m2
    protocol: AXI4
    fabric: bus
    data_width: 32
    addr_width: 32
    id_width: 3
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: s0
    protocol: AXI4
    fabric: bus
    data_width: 32
    addr_width: 32
    id_width: 5
    id_width_auto: true
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: s1
    protocol: AXI4
    fabric: bus
    data_width: 32
    addr_width: 32
    id_width: 5
    id_width_auto: true
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: s2
    protocol: AXI4
    fabric: bus
    data_width: 32
    addr_width: 32
    id_width: 5
    id_width_auto: true
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
bridges: []
adapters: []
port_options:
  - port: m0
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: m1
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: m2
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: s0
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: s1
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: s2
    fifo_depth: 0
    slice: none
    prot: drive
    qos: drive
    region: drive
    cache: drive
    lock: drive
    pstrb: n/a
    pslverr: n/a
user_ports: []
memory_map:
  - slave: s0
    region: regs
    base: '0x1000_0000'
    size: '0x0000_4000'
    access: RW
    secure: false
    fabric: bus
  - slave: s1
    region: regs
    base: '0x1001_0000'
    size: '0x0000_4000'
    access: RO
    secure: false
    fabric: bus
  - slave: s2
    region: regs
    base: '0x1002_0000'
    size: '0x0000_4000'
    access: RW
    secure: false
    fabric: bus
hierarchy:
  top: axi_shared_fixed_top
  wrappers: []
  placement:
    - instance: bus
      kind: fabric
      wrapper: axi_shared_fixed_top
      rtl_name: u_bus
wrapper:
  top: axi_shared_fixed_top
  port_style: flat
  signal_pattern: '{port}_{proto}_{signal}'
  clock_reset_ports: one per domain
  package: axi_shared_fixed_pkg
  file_header: header.txt
  extra_inputs: []
  adapter_placement: with fabric
  adapter_naming: '{from}_{type}_2_{to}'
  subwrapper_port_naming: '{instance}_{proto}_{signal}'
  ports:
    - port: m0
      exposed: true
      prefix: null
    - port: m1
      exposed: true
      prefix: null
    - port: m2
      exposed: true
      prefix: null
    - port: s0
      exposed: true
