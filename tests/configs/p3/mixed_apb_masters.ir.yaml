schema: '0.5'
project:
  name: mixed_apb_masters
  revision: p3
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/mixed_apb_masters
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: ahb
    protocol: AHB-Lite
    topology: single-layer
    data_width: 64
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_ahb_lite_bus
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: br_ahb
        priority: null
    slave_ports:
      - index: 0
        port: sram
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: sram
        region: mem
        base: '0x5000_0000'
        end: '0x5000_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_ahb
        miss: HRESP_ERROR
        default_slave: null
        aliases: []
  - name: dbg_apb
    protocol: APB4
    topology: decoder-mux
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: dbg
        priority: null
    slave_ports:
      - index: 0
        port: br_ahb
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: br_ahb
        region: win
        base: '0x5000_0000'
        end: '0x5000_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: dbg
        miss: PSLVERR
        default_slave: null
        aliases: []
  - name: jtag_apb
    protocol: APB3
    topology: decoder-mux
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: single-master
    latency_mode: null
    max_mst_trans: null
    max_slv_trans: null
    midpoint: null
    template: bag_apb_mux
    backing_ip: in-house template
    master_ports:
      - index: 0
        port: jtag
        priority: null
    slave_ports:
      - index: 0
        port: br_lite
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: br_lite
        region: win
        base: '0x4000_0000'
        end: '0x4000_FFFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: jtag
        miss: PSLVERR
        default_slave: null
        aliases: []
  - name: lite
    protocol: AXI4-Lite
    topology: crossbar
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: NO_LATENCY
    max_mst_trans: 2
    max_slv_trans: 2
    midpoint: null
    template: bag_axil_xbar
    backing_ip: PULP
    master_ports:
      - index: 0
        port: br_lite
        priority: null
    slave_ports:
      - index: 0
        port: pmu
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: pmu
        region: regs
        base: '0x4000_0000'
        end: '0x4000_0FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: br_lite
        miss: DECERR
        default_slave: null
        aliases: []
masters:
  - name: dbg
    protocol: APB4
    fabric: dbg_apb
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
  - name: jtag
    protocol: APB3
    fabric: jtag_apb
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: pmu
    protocol: AXI4-Lite
    fabric: lite
    data_width: 32
    addr_width: 12
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: sram
    protocol: AHB-Lite
    fabric: ahb
    data_width: 64
    addr_width: 16
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: HRESP_ERROR
    wait_states: 0
bridges:
  - name: br_ahb
    template: bag_apb2ahb
    upstream: dbg_apb
    downstream: ahb
    window_base: '0x5000_0000'
    pass_through: false
    fifo_depth: 0
    upstream_protocol: APB4
    downstream_protocol: AHB-Lite
    upstream_width: 32
    downstream_width: 64
    cdc: false
  - name: br_lite
    template: bag_apb2axi
    upstream: jtag_apb
    downstream: lite
    window_base: '0x4000_0000'
    pass_through: true
    fifo_depth: 0
    upstream_protocol: APB3
    downstream_protocol: AXI4-Lite
    upstream_width: 32
    downstream_width: 32
    cdc: false
adapters: []
port_options:
  - port: br_ahb
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: drive
    pstrb: n/a
    pslverr: n/a
  - port: br_lite
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: dbg
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
  - port: jtag
    fifo_depth: 0
    slice: none
    prot: n/a
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: drive
  - port: pmu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: sram
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
user_ports: []
memory_map:
  - slave: br_lite
    region: win
    base: '0x4000_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: jtag_apb
  - slave: pmu
    region: regs
    base: '0x4000_0000'
    size: '0x0000_1000'
    access: RW
    secure: false
    fabric: lite
  - slave: sram
    region: mem
    base: '0x5000_0000'
    size: '0x0001_0000'
    access: RW
    secure: false
    fabric: ahb
  - slave: br_ahb
    region: win
    base: '0x5000_0000'
    size: '0x0001_0000'
