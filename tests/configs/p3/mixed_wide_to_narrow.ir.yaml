      wrapper: mixed_wide_to_narrow_top
      rtl_name: u_per
    - instance: xbar
      kind: fabric
      wrapper: mixed_wide_to_narrow_top
      rtl_name: u_xbar
    - instance: xbar_dw_2_mem
      kind: adapter
      wrapper: mixed_wide_to_narrow_top
      rtl_name: u_xbar_dw_2_mem
wrapper:
  top: mixed_wide_to_narrow_top
  port_style: flat
  signal_pattern: '{port}_{proto}_{signal}'
  clock_reset_ports: one per domain
  package: mixed_wide_to_narrow_pkg
  file_header: header.txt
  extra_inputs: []
  adapter_placement: with fabric
  adapter_naming: '{from}_{type}_2_{to}'
  subwrapper_port_naming: '{instance}_{proto}_{signal}'
  ports:
    - port: br_ahb
      exposed: false
      prefix: null
    - port: br_per
      exposed: false
      prefix: null
    - port: byte
      exposed: true
