schema: '0.5'
project:
  name: axil_shared_one
  revision: p3
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/axil_shared_one
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: bus
    protocol: AXI4-Lite
    topology: shared-bus
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: null
    max_mst_trans: 2
    max_slv_trans: 2
    midpoint:
      fifo_depth: 4
      slice: none
    template: bag_axil_shared_bus
    backing_ip: PULP
    master_ports:
      - index: 0
        port: m0
        priority: null
    slave_ports:
      - index: 0
        port: s0
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: s0
        region: regs
        base: '0x1000_0000'
        end: '0x1000_3FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: m0
        miss: DECERR
        default_slave: null
        aliases: []
masters:
  - name: m0
    protocol: AXI4-Lite
    fabric: bus
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: s0
    protocol: AXI4-Lite
    fabric: bus
    data_width: 32
    addr_width: 32
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
bridges: []
adapters: []
port_options:
  - port: m0
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: s0
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
user_ports: []
memory_map:
  - slave: s0
    region: regs
    base: '0x1000_0000'
    size: '0x0000_4000'
    access: RW
    secure: false
    fabric: bus
hierarchy:
  top: axil_shared_one_top
  wrappers: []
  placement:
    - instance: bus
      kind: fabric
      wrapper: axil_shared_one_top
      rtl_name: u_bus
wrapper:
  top: axil_shared_one_top
  port_style: flat
  signal_pattern: '{port}_{proto}_{signal}'
  clock_reset_ports: one per domain
  package: axil_shared_one_pkg
  file_header: header.txt
  extra_inputs: []
  adapter_placement: with fabric
  adapter_naming: '{from}_{type}_2_{to}'
  subwrapper_port_naming: '{instance}_{proto}_{signal}'
  ports:
    - port: m0
      exposed: true
      prefix: null
    - port: s0
      exposed: true
      prefix: null
provenance:
  bag_version: 0.0.1
  source: axil_shared_one.xlsx
