  - port: timer0
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: drive
    pslverr: drive
  - port: uart0
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
