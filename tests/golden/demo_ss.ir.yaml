    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: tie-0
    pstrb: n/a
    pslverr: n/a
  - port: pmu0
    fifo_depth: 0
    slice: none
    prot: drive
