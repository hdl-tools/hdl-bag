    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: tie-default
    pslverr: drive
  - port: sec0
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
