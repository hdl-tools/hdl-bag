schema: '0.7'
project:
  name: lite_ss
  module_prefix: null
  revision: r1
  author: BAG
  sv_std: IEEE 1800-2017
  output_dir: out/lite_ss
  outputs:
    rtl: true
    c_header: true
    doc: true
    tests: true
    formal: true
  lint_tools:
    - slang
    - verilator
    - verible
  simulator: verilator
clocks:
  - name: clk_sys
    mhz: 100
    source: top port
    domain: D_SYS
    reset: rst_sys_n
resets:
  - name: rst_sys_n
    polarity: active-low
    assertion: async
    deassertion: sync
    source: top port
    domain: D_SYS
fabrics:
  - name: bus
    protocol: AXI4-Lite
    topology: shared-bus
    data_width: 32
    addr_width: 32
    domain: D_SYS
    arbitration: round-robin
    latency_mode: null
    max_mst_trans: 2
    max_slv_trans: 2
    midpoint:
      fifo_depth: 4
      slice: none
    template: bag_axil_shared_bus
    backing_ip: PULP
    external_module: null
    master_ports:
      - index: 0
        port: cpu
        priority: null
    slave_ports:
      - index: 0
        port: sram
        priority: null
      - index: 1
        port: uart
        priority: null
    id_width: null
    max_parallel: 1
    addr_rules:
      - slave_port: 0
        slave: sram
        region: mem
        base: '0x1000_0000'
        end: '0x1000_3FFF'
        access: RW
        secure: false
      - slave_port: 1
        slave: uart
        region: regs
        base: '0x2000_0000'
        end: '0x2000_0FFF'
        access: RW
        secure: false
    access_rules: []
    decode:
      - master: cpu
        miss: DECERR
        default_slave: null
        aliases: []
masters:
  - name: cpu
    protocol: AXI4-Lite
    fabric: bus
    data_width: 32
    addr_width: 32
    id_width: null
    user_width: 0
    domain: D_SYS
    max_outstanding_rd: 1
    max_outstanding_wr: 1
slaves:
  - name: sram
    protocol: AXI4-Lite
    fabric: bus
    data_width: 32
    addr_width: 32
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
  - name: uart
    protocol: AXI4-Lite
    fabric: bus
    data_width: 32
    addr_width: 32
    id_width: null
    id_width_auto: false
    user_width: 0
    domain: D_SYS
    error_response: SLVERR
    wait_states: 0
bridges: []
adapters: []
port_options:
  - port: cpu
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: sram
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
  - port: uart
    fifo_depth: 0
    slice: none
    prot: drive
    qos: n/a
    region: n/a
    cache: n/a
    lock: n/a
    pstrb: n/a
    pslverr: n/a
user_ports: []
memory_map:
  - slave: sram
    region: mem
    base: '0x1000_0000'
    size: '0x0000_4000'
    access: RW
    secure: false
    fabric: bus
  - slave: uart
    region: regs
    base: '0x2000_0000'
    size: '0x0000_1000'
    access: RW
    secure: false
    fabric: bus
hierarchy:
  top: lite_ss_top
  wrappers: []
  placement:
    - instance: bus
      kind: fabric
      wrapper: lite_ss_top
      rtl_name: u_bus
wrapper:
  top: lite_ss_top
  port_style: flat
  signal_pattern: '{port}_{proto}_{signal}'
  clock_reset_ports: one per domain
  package: lite_ss_pkg
  file_header: null
  extra_inputs: []
  adapter_placement: with fabric
  adapter_naming: '{from}_{type}_2_{to}'
  subwrapper_port_naming: '{instance}_{proto}_{signal}'
  ports:
    - port: cpu
      exposed: true
      prefix: null
    - port: sram
      exposed: true
      prefix: null
    - port: uart
      exposed: true
      prefix: null
provenance:
  bag_version: 1.0.0
  source: lite_ss.xlsx
  sha256: ddb73e45ab878cc94250d938526f537dd2340a965333b52628139280e40e2f23
