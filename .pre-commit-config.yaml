repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: spdx-header
        name: SPDX header
        entry: uv run python scripts/check_spdx.py
        language: system
        types_or: [python, dockerfile]
